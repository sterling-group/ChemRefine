[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ChemRefine"
version = "2.0.0"
description = "An automated and interoperable manager for computational chemistry workflows."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Sterling Group", email = "ignaciomigliaro@outlook.com"},
]
keywords = [
    "computational chemistry",
    "conformer sampling",
    "ORCA",
    "molecular dynamics",
    "quantum chemistry",
    "automation",
    "HPC",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    # Each floor is the lowest version with wheels for every Python in
    # `requires-python` (3.11, 3.12, 3.13). On Python 3.13 pip will
    # always resolve numpy to 2.x — pandas 2.2.3 (and later) supports
    # both numpy 1.26 and 2.x, so the matrix is internally consistent.
    "numpy>=1.26",
    "pyyaml>=6.0.2",
    "pandas>=2.2.3",
    "ase>=3.26.0",
    "rdkit>=2024.9",
    "pydantic>=2.5",
    "typer>=0.12",
]

[project.optional-dependencies]
# Flask/waitress live here only — every backend that needs the ExtOpt
# HTTP server (mlff, pyscf) cross-references `chemrefine[server]` instead
# of re-pinning them, so the server deps have a single source of truth.
# downloads: flask, waitress (tiny)
server = [
    "flask>=3.0",
    "waitress>=3.0",
]
# `mace-torch` pins `e3nn==0.4.4` exactly while every PyPI release of
# `fairchem-core` requires `e3nn>=0.5`. The two are mutually
# unsatisfiable, so we install fairchem from a patched fork that
# relaxes the e3nn floor. The fork can be swapped for the upstream
# PyPI release once either side gives ground.
# downloads: torch (+CUDA), e3nn, mace-torch, fairchem-core (git clone), + server (heavy)
mlip = [
    "torch>=2.8.0,<2.9.0",
    "e3nn==0.4.4",
    "mace-torch>=0.3.16",
    "fairchem-core @ git+https://github.com/sterling-group/fairchem-patched.git@main#subdirectory=packages/fairchem-core",
    # Swap in once mace-torch lifts its `e3nn==0.4.4` pin and the
    # fork above is no longer needed:
    # "fairchem-core>=2.9",
    "chemrefine[server]",
]
# Back-compat alias: `mlff` was renamed to `mlip`; keep the old extra working.
mlff = ["chemrefine[mlip]"]
# The `pyscf` and `pyscf-extopt` engines import `pyscf` lazily; the extopt
# path also needs the server, so cross-reference `[server]`.
# downloads: pyscf (libcint/libxc), + server (moderate)
pyscf = [
    "pyscf>=2.6",
    "chemrefine[server]",
]
# GPU SCF path (`run_dft(..., want_gpu=True)` in pyscf/_runtime). gpu4pyscf
# needs pyscf, so cross-reference `[pyscf]` for a complete stack.
# downloads: gpu4pyscf (→ cupy/CUDA), + pyscf (heavy, GPU)
pyscf-gpu = [
    "gpu4pyscf",
    "chemrefine[pyscf]",
]
# downloads: pytest, pytest-cov (tiny)
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# downloads: mkdocs, mkdocs-material, interrogate (small)
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "interrogate>=1.7",
]
# Convenience superset for contributors: cross-references `[test]` and
# `[docs]` so their pinned tools (pytest, interrogate, ...) only need
# one source of truth, plus the linting tools that have no separate
# extra of their own.
# downloads: test + docs, ruff, pre-commit (small)
dev = [
    "chemrefine[test,docs]",
    "ruff>=0.5",
    "pre-commit>=3.5",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Homepage = "https://github.com/sterling-group/ChemRefine"
Documentation = "https://sterling-group.github.io/ChemRefine/"
Repository = "https://github.com/sterling-group/ChemRefine.git"
Issues = "https://github.com/sterling-group/ChemRefine/issues"

[project.scripts]
chemrefine = "chemrefine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chemrefine"]

[tool.hatch.build.targets.sdist]
include = [
    "src/chemrefine",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Add `tests/` to sys.path so test files can `from synthetic import …`
# without making the tests directory a package.
pythonpath = ["tests"]
markers = [
    "slow: tests that take longer than 1 second",
    "gpu: tests that require CUDA",
    "integration: tests that invoke real ORCA / SLURM / external services",
]

[tool.coverage.run]
source = ["chemrefine"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.interrogate]
ignore-init-module = true
ignore-init-method = true
ignore-magic = true
ignore-nested-functions = true
fail-under = 100
exclude = ["tests", "Examples", "build", "dist"]
