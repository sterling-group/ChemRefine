[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ChemRefine"
version = "4.0.0"
description = "An automated and interoperable manager for computational chemistry workflows."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11, <3.14"
authors = [
    {name = "Sterling Group", email = "ignaciomigliaro@outlook.com"},
]
keywords = [
    "computational chemistry",
    "conformer sampling",
    "ORCA",
    "molecular dynamics",
    "quantum chemistry",
    "automation",
    "HPC",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "pyyaml",
    "pandas>=1.5",
    "ase>=3.25.0",
    "rdkit",
    "scikit-learn>=1.3",
    "pydantic>=2",
    "typer>=0.12",
]

[project.optional-dependencies]
mlff = [
    "torch>=2.8.0,<2.9.0",
    "e3nn==0.4.4",
    "mace-torch>=0.3.16",
    "fairchem-core @ git+https://github.com/sterling-group/fairchem-patched.git@main#subdirectory=packages/fairchem-core",
    "flask",
    "waitress",
    "requests",
]
server = [
    "flask",
    "waitress",
    "requests",
]
test = [
    "pytest",
    "pytest-cov",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "interrogate",
]
dev = [
    "ruff",
    "pre-commit",
    "interrogate",
    "pytest",
    "pytest-cov",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Homepage = "https://github.com/sterling-group/ChemRefine"
Documentation = "https://github.com/sterling-group/ChemRefine/blob/main/README.md"
Repository = "https://github.com/sterling-group/ChemRefine.git"
Issues = "https://github.com/sterling-group/ChemRefine/issues"

[project.scripts]
chemrefine = "chemrefine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/chemrefine"]

[tool.hatch.build.targets.sdist]
include = [
    "src/chemrefine",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: tests that take longer than 1 second",
    "gpu: tests that require CUDA",
    "integration: tests that invoke real ORCA / SLURM / external services",
]

[tool.coverage.run]
source = ["chemrefine"]
omit = [
    # Pure-placeholder modules — bodies land in Phase B; coverage gate
    # comes back online for these as each placeholder is ported.
    "src/chemrefine/engines/orca/extopt/*",   # B1: ExtOpt protocol port
    "src/chemrefine/engines/mlff/trainer.py",  # B5: MLFF trainer port
    "src/chemrefine/engines/pyscf/direct.py",  # B7: PySCF direct port
]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    'if __name__ == "__main__":',
    "\\.\\.\\.",                  # Protocol method bodies (`...`)
]

[tool.interrogate]
ignore-init-module = true
ignore-init-method = true
ignore-magic = true
ignore-nested-functions = true
fail-under = 100
exclude = ["tests", "Examples", "build", "dist"]
