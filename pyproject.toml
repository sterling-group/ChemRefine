[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ChemRefine"
version = "2.0.0"
description = "An automated and interoperable manager for computational chemistry workflows."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# The group is the package author; individual authorship + ORCIDs live in
# CITATION.cff, which is what the paper and GitHub's "Cite this repository"
# button serve. No email here on purpose: PyPI metadata is immutable once
# uploaded, and contact is routed via [project.urls] Issues and SECURITY.md.
authors = [
    {name = "Sterling Group"},
]
keywords = [
    "computational chemistry",
    "conformer sampling",
    "ORCA",
    "molecular dynamics",
    "quantum chemistry",
    "automation",
    "HPC",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    # Each floor is the lowest version pip can actually install on the oldest supported
    # Python — held by CI's `floors` job, which installs exactly these versions on 3.11
    # and runs the suite. The tested matrix is 3.11 through 3.14; newer Pythons resolve
    # above some floors on wheel availability alone, which is fine — the floor is a
    # promise about the range, not a pin. numpy's 1.26.0/1.26.1 and rdkit's bare 2024.9
    # are not on PyPI (yanked / never published), so naming them would promise a minimum
    # nobody can resolve; on Python 3.13+ pip always resolves numpy to 2.x — pandas
    # 2.2.3 (and later) supports both numpy 1.26 and 2.x, so the matrix is internally
    # consistent.
    "numpy>=1.26.2",
    "pyyaml>=6.0.2",
    # pandas is a hard requirement — every run writes steps.csv — but it is imported
    # lazily inside the two functions that use it (io.save_step_csv, io.smiles_to_xyz)
    # so `chemrefine --version` and `--help` stay fast. Same for rdkit below.
    "pandas>=2.2.3",
    "ase>=3.26.0",
    "rdkit>=2024.9.1",
    # 2.12, not 2.5: the `floors` job installs the suite's extras alongside these pins,
    # and both `[mcp]` and `[agent]` require pydantic>=2.12 — so `pydantic==2.5` was a
    # floor no configuration could resolve (`pip install pydantic==2.5 'mcp>=2,<3'` is
    # ResolutionImpossible, with no older 2.x mcp to back off to). A floor is the lowest
    # version the tested configuration can actually install; this is it.
    "pydantic>=2.12",
    "typer>=0.12",
]

[project.optional-dependencies]
# Flask/waitress live here only: every extra that needs the ExtOpt HTTP server or the
# GUI cross-references `chemrefine[server]` rather than re-pinning them, so the server
# deps have a single source of truth. Stated as the rule rather than a list of which
# extras — the list was written when there were two and is now eight.
server = [
    "flask>=3.0",
    "waitress>=3.0",
]
# The MCP server (`chemrefine mcp`) — the official Model Context Protocol SDK.
# v2 is its stable line (MCPServer, in-memory Client for tests); <3 guards the
# next breaking major the way the v1→v2 rename broke FastMCP imports.
mcp = ["mcp>=2,<3"]
# The YAML-builder GUI (`chemrefine gui`) — pure re-use of the [server] pins
# (flask/waitress); the frontend is vendored static JS, no dependency of its own.
gui = ["chemrefine[server]"]
# The embedded chat agent (`chemrefine agent`) — PydanticAI's slim install with
# the openai extra, which covers every OpenAI-compatible endpoint (OpenAI itself,
# Ollama, vLLM, OpenRouter, Groq). Other native providers are their own
# pydantic-ai-slim extras a user adds when needed.
agent = ["pydantic-ai-slim[openai]>=2,<3"]
# MLIP backends — one self-contained extra each (mirrors the per-backend modules in
# engines/mlip/backends/). Every backend installs into its OWN dedicated environment:
# their torch/e3nn trees conflict and can never share one env — MACE pins `e3nn==0.4.4`,
# FAIRChem/SevenNet need `e3nn>=0.5`, orb/chgnet drag their own torch. So install each
# separately (the `chemrefine backends` helper automates the per-backend env). `[mlip]`
# defaults to FAIRChem / UMA (`uma-s-1p2`).
mlip-fairchem = [
    "fairchem-core>=2.18",
    "chemrefine[server]",
]
mlip-mace = [
    "torch>=2.8.0,<2.9.0",
    "e3nn==0.4.4",
    "mace-torch>=0.3.16",
    "chemrefine[server]",
]
mlip-sevenn = ["sevenn>=0.11", "chemrefine[server]"]
# The marker is load-bearing: without it, `pip install chemrefine[mlip-orb]` on 3.11
# backtracks through every orb-models release looking for a compatible one and ends in
# a resolver wall of text instead of "requires a different Python".
mlip-orb = ["orb-models; python_version >= '3.12'", "chemrefine[server]"]
mlip-chgnet = ["chgnet>=0.4", "chemrefine[server]"]
mlip = ["chemrefine[mlip-fairchem]"]
# Back-compat alias: `mlff` was renamed to `mlip`; keep the old extra working.
mlff = ["chemrefine[mlip]"]
# The `pyscf` and `pyscf-extopt` engines import `pyscf` lazily; the extopt
# path also needs the server, so cross-reference `[server]`.
pyscf = [
    "pyscf>=2.6",
    "chemrefine[server]",
]
# GPU SCF path (`run_dft(..., want_gpu=True)` in pyscf/_runtime). The bare
# `gpu4pyscf` on PyPI is an sdist that needs a CUDA build toolchain; the usable
# prebuilt wheels are the CUDA-tagged `gpu4pyscf-cudaNNx` + matching `cutensor-cuNN`.
# This targets CUDA 12.x — CUDA-11 hosts swap in `gpu4pyscf-cuda11x` + `cutensor-cu11`.
# gpu4pyscf needs pyscf, so cross-reference `[pyscf]` for a complete stack.
# The floors are the first stable line that resolves alongside `pyscf>=2.6` (verified by
# a pinned `--dry-run` resolution): 1.0 is gpu4pyscf's first stable release, and the
# cutensor 2.x line is what it requires. These were the last unfloored pins in the file —
# an extra with no floor promises whatever pip picks today, which is no promise at all.
pyscf-gpu = [
    "gpu4pyscf-cuda12x>=1.0",
    "cutensor-cu12>=2.0.0",
    "chemrefine[pyscf]",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Property tests for the numerical core (tests/test_properties.py) — the invariants
    # that have to hold for every input, as opposed to the cases someone thought of.
    "hypothesis>=6.100",
    # The suite is not a subset of the package: it drives the ExtOpt sidecar
    # (test_engines_extopt), the builder (test_gui), the MCP session (test_mcp_server)
    # and the embedded agent (test_agent_embedded) against the real SDKs. Declaring that
    # here rather than on each install line is what stops a job installing `[test]` alone
    # and collecting a suite it cannot run — which is exactly what ci.yml's mutation-gate
    # and provisioned-backend jobs were doing. `server` is named rather than left to
    # arrive via `gui`, because the extopt tests need it for their own reason.
    "chemrefine[server,mcp,gui,agent]",
    # A Node for tests/test_gui_assets.py — `node --check` on the four scripts and `node -e`
    # on the pure form logic, the one layer no Python gate can see. Declared rather than
    # left to whatever is on PATH because a machine without one turned seven tests into
    # skips while the suite still exited 0; CHEMREFINE_REQUIRE_NODE (set by ci.yml and
    # release-check.sh) is what makes that impossible to ship.
    #
    # `>=24` is a *tool* floor and follows a different rule from the dependency floors
    # above: the stable majors are 20, 22 and 24, and 24 is the only one still in active
    # LTS — 20 went EOL in April 2025 and 22 is in maintenance. Not "the lowest that
    # resolves", which would be 20 and would mean gating the frontend on an unsupported
    # runtime. (The 25.x and 26.x lines are release candidates; pip skips them.)
    "nodejs-wheel-binaries>=24",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "interrogate>=1.7",
]
# Convenience superset for contributors: cross-references `[test]` and
# `[docs]` so their pinned tools (pytest, interrogate, ...) only need
# one source of truth, plus the linting tools that have no separate
# extra of their own. `[test]` carries the SDKs the suite imports, so
# naming them again here would be a second roster to keep in step.
dev = [
    "chemrefine[test,docs]",
    # `scripts/release-check.sh` reproduces CI's build-package job with `python -m build`,
    # and promises a `[dev]` install is all it needs — so the tool it calls is declared
    # here. twine stays out on purpose: it publishes rather than gates, and the script
    # puts it in a throwaway venv of its own.
    "build>=1.2",
    # Matched to the pinned pre-commit hook rev — that hook is what actually gates,
    # so a floor years behind it is decorative.
    "ruff>=0.16",
    "mypy>=1.11",
    "types-PyYAML",
    "pre-commit>=3.5",
]

[project.urls]
Homepage = "https://github.com/sterling-group/ChemRefine"
Documentation = "https://sterling-group.github.io/ChemRefine/"
Repository = "https://github.com/sterling-group/ChemRefine.git"
Issues = "https://github.com/sterling-group/ChemRefine/issues"

[project.scripts]
chemrefine = "chemrefine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chemrefine"]

[tool.hatch.build.targets.sdist]
# `tests` ships so a distro packager can actually run the suite from the sdist —
# the fixtures are a megabyte or so, most of it trimmed real ORCA output and the
# compressed e2e recordings, which is what makes the tests meaningful in the first
# place. `examples` ships for the same reason (and as the paper artifacts they are):
# the example sweep and one ORCA-inspect fixture read them, so without them the suite
# the sdist promises fails. `docs` stays out on size — it is the largest directory in
# the tree — and its drift tests skip themselves when it is absent.
#
# Every pattern is anchored with a leading `/`. Hatchling patterns are
# gitignore-style and a bare name matches at any depth — the unanchored
# `README.md` shipped `examples/README.md` alone, which is how the drift went
# unnoticed. CI runs this suite from the built sdist, so the promise is gated.
include = [
    "/src/chemrefine",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.mypy]
# The lowest version the *installed* dependency set can be checked at, which is no longer
# the same as `requires-python`. numpy 2.5 requires Python >= 3.12 and its stubs use PEP
# 695 `type` statements, so mypy targeting 3.11 fails parsing numpy's own `__init__.pyi` —
# a configuration (3.11 + numpy 2.5) pip cannot produce, since 3.11 resolves numpy 2.4.x.
# There is no way to scope that away: it is a parse error, so per-module `follow_imports`,
# `ignore_errors` and `disable_error_code` all fail to suppress it (python/mypy#21178).
#
# 3.11 support is not weakened by this — it is held where it always mattered, by CI's
# `test` matrix *running* the suite on 3.11 under a 100% coverage gate, so a 3.12-only
# syntax or API in any line fails there. Raise this only when the floor of what the deps
# allow rises again.
python_version = "3.12"
files = ["src/chemrefine", "tests"]
# Step templates are `string.Template` sources, not modules: they carry bare
# `$PLACEHOLDER` tokens and are rendered before anything executes them. Excluded for
# the same reason ruff excludes them — and because several cases naming their template
# `step1.py` is the normal convention, not a module-name collision to resolve.
#
# This list must cover the same files as `[tool.ruff].extend-exclude`, and it is a regex
# where ruff's is a glob. `files` above means a bare `mypy` (what CI runs) never reaches
# `examples/`, but `mypy .` did, and failed on a template's bare `$PLACEHOLDER` — a stop
# that says "invalid syntax" about a file that is not Python and never claimed to be.
exclude = [
    "tests/data/e2e/cases/.*/templates/.*\\.py$",
    "examples/.*/templates/.*\\.py$",
]
plugins = ["pydantic.mypy"]
strict = true
# The scientific stack publishes no stubs, so every call into it reads as an "untyped
# call". Excluding those packages keeps `disallow_untyped_calls` meaningful for our own
# code — where it catches a genuinely unannotated helper — without turning every
# `atoms.get_positions()` into an error.
untyped_calls_exclude = ["ase", "rdkit", "pyscf", "gpu4pyscf", "pandas"]
# Annotation requirements are relaxed here and re-imposed on `chemrefine.*` below, rather
# than the other way round. Tests are worth type-checking for the calls they make *into*
# the package — a wrong argument, a renamed keyword, a field that moved — and that needs
# no annotations on the test functions themselves. Doing it in this direction means a new
# test file is covered automatically; mypy's module wildcards match whole components, so
# there is no `test_*` pattern that would catch them the other way round.
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
# One comment per entry, inline. A misspelled attribute in a test still fails the test.
disable_error_code = [
    # Two deliberate test techniques, not defects. `get_engine` returns the narrow
    # `CalculationEngine` protocol, so a test exercising a `JobEngine` primitive reaches
    # past it on purpose; and monkeypatching an imported module
    # (`patch.object(slurm, "subprocess", ...)`) trips `no_implicit_reexport`.
    "attr-defined",
    # Fakes and stubs stand in for Protocols structurally. They satisfy the contract at
    # runtime — that is what the tests prove — but their unannotated methods cannot be
    # matched against the Protocol statically without annotating every fake.
    "arg-type",
    # ase's `read` is typed `Atoms | list[Atoms]`; tests that know which one they asked
    # for would otherwise need a narrowing assert on every line.
    "union-attr",
    # Bare generics in test-local helper annotations.
    "type-arg",
]

[[tool.mypy.overrides]]
module = ["chemrefine.*"]
# The four codes above are relaxed for the *tests*, and every reason given for relaxing them
# is a testing technique — none of them describes `src/`. They are disabled globally anyway,
# because a per-module section cannot select the tests: mypy patterns are module paths whose
# `*` matches a whole component, and `tests/` holds bare top-level modules (`test_cache`,
# `conftest`), so `test_*` is rejected outright. Turning them back on here is the only way
# round that, and it is what keeps the package held to them rather than sharing a relaxation
# written for something else.
enable_error_code = ["attr-defined", "arg-type", "union-attr", "type-arg"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true

[[tool.mypy.overrides]]
# Untyped scientific stack — no stubs published; their objects cross our
# boundary as documented-but-Any values.
module = [
    "ase.*",
    "rdkit.*",
    "pyscf.*",
    "gpu4pyscf.*",
    "mace.*",
    "fairchem.*",
    "sevenn.*",
    "orb_models.*",
    "chgnet.*",
    "flask.*",
    "waitress.*",
    "pandas.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
# Engine step templates are rendered through `string.Template` before they are
# executed, so they legitimately contain bare `$PLACEHOLDER` tokens (e.g.
# `charge=$CHARGE`) and are not parseable Python on their own. The e2e case
# templates are the same kind of file and belong here for the same reason — they
# only escaped notice while the first of them happened to keep every placeholder
# inside a string literal, which is not a property worth relying on.
extend-exclude = [
    "examples/*/templates/*.py",
    "examples/*/*/templates/*.py",
    "tests/data/e2e/cases/*/templates/*.py",
]

[tool.ruff.lint]
# `S` (bandit) is on so every shell-out and subprocess call has to be either safe by
# construction or carry a `# noqa: S...` naming why it is fine — which turns the
# security review into something a diff can show rather than something a reader has to
# reconstruct. `ERA` catches commented-out code left behind.
#
# `ARG` is deliberately NOT selected: this codebase is Protocol- and base-class-heavy by
# design, so unused parameters are usually the *contract* (an engine hook that ignores
# `ctx`, a `ComputeBackend` classmethod that takes args it doesn't need). Enabling it
# would mean ~15 noqa comments on interface methods, which makes the code worse.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH", "RET", "C4", "TID", "S", "ERA"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately assert on subprocess plumbing, bind throwaway sockets, and use
# assert as their whole purpose. ERA reads their `# section name` dividers as
# commented-out code.
"tests/**" = ["S", "ERA"]

[tool.pytest.ini_options]
# Tier-3 live-integration tests need real binaries (ORCA, an MLIP stack) and
# real runtime; opt in explicitly with `pytest -m integration`.
addopts = "-m 'not integration and not perf' --strict-markers --strict-config"
testpaths = ["tests"]
# Add `tests/` to sys.path so test files can `from synthetic import …`
# without making the tests directory a package.
pythonpath = ["tests"]
# A warning from a dependency is how a deprecation reaches us before it becomes a
# breakage; failing on it means we hear about it on the release that introduces it
# rather than the one that removes the API. The suite is clean under this today.
filterwarnings = [
    "error",
    # PydanticAI's run_sync spins its own loop; on 3.12+ the stdlib deprecates the
    # implicit get_event_loop it touches on the way. Their issue, not a signal in ours —
    # matched narrowly so every other DeprecationWarning still fails the suite.
    "ignore:There is no current event loop:DeprecationWarning",
    # numpy 2.5 deprecates assigning `.shape`, and ase 3.29 still does it in ~18 places —
    # `Atoms.new_array` among them, so *any* empty `Atoms()` warns. On a fresh install
    # (numpy 2.5.2 + ase 3.29.0) that is 68 failures, none of them ours: chemrefine
    # assigns `.shape` nowhere, and the two versions work together at runtime. They just
    # say so, and `error` above turns saying so into a red suite.
    #
    # ase fixed all of it — every ndarray `.shape =` is gone from master, which is
    # 3.30.0b1 — so this expires with the 3.30 release: raise the ase floor and delete
    # the line. Capping numpy instead would constrain every user's environment to spare
    # ourselves a warning none of them would ever see.
    #
    # Scoped to ase rather than to one module because the deprecation is spread across
    # eleven of them and only two fire today; scoped by module rather than by message
    # alone so it stays narrow — verified that the identical warning raised from
    # chemrefine's own code still fails the suite.
    'ignore:Setting the shape on a NumPy array:DeprecationWarning:ase\.',
]
markers = [
    "slow: tests that take longer than 1 second",
    "gpu: tests that require CUDA",
    "integration: tests that invoke real ORCA / SLURM / external services",
    # Distinct from `integration`, which is about *what* a test reaches for, and from `slow`,
    # which still runs by default. This one is about cost: a tier that builds 10⁴ structures
    # to measure how the bookkeeping scales, and so does not belong in the edit loop.
    "perf: tests that measure scaling; too costly for the default loop",
]

[tool.coverage.run]
source = ["chemrefine"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.interrogate]
ignore-init-module = true
ignore-init-method = true
ignore-magic = true
ignore-nested-functions = true
fail-under = 100
exclude = ["tests", "examples", "build", "dist"]
