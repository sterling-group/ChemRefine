[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ChemRefine"
version = "4.0.0"
description = "An automated and interoperable manager for computational chemistry workflows."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Sterling Group", email = "ignaciomigliaro@outlook.com"},
]
keywords = [
    "computational chemistry",
    "conformer sampling",
    "ORCA",
    "molecular dynamics",
    "quantum chemistry",
    "automation",
    "HPC",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    # Each floor is the lowest version with wheels for every Python in
    # `requires-python` (3.11, 3.12, 3.13). On Python 3.13 pip will
    # always resolve numpy to 2.x — pandas 2.2.3 (and later) supports
    # both numpy 1.26 and 2.x, so the matrix is internally consistent.
    "numpy>=1.26",
    "pyyaml>=6.0.2",
    "pandas>=2.2.3",
    "ase>=3.26.0",
    "rdkit>=2024.9",
    "scikit-learn>=1.5.2",
    "pydantic>=2.5",
    "typer>=0.12",
]

[project.optional-dependencies]
# `mace-torch` pins `e3nn==0.4.4` exactly while every PyPI release of
# `fairchem-core` requires `e3nn>=0.5`. The two are mutually
# unsatisfiable, so we install fairchem from a patched fork that
# relaxes the e3nn floor. The fork can be swapped for the upstream
# PyPI release once either side gives ground.
mlff = [
    "torch>=2.8.0,<2.9.0",
    "e3nn==0.4.4",
    "mace-torch>=0.3.16",
    "fairchem-core @ git+https://github.com/sterling-group/fairchem-patched.git@main#subdirectory=packages/fairchem-core",
    "flask>=3.0",
    "waitress>=3.0",
]
server = [
    "flask>=3.0",
    "waitress>=3.0",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "interrogate>=1.7",
]
dev = [
    "ruff>=0.5",
    "pre-commit>=3.5",
    "interrogate>=1.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Homepage = "https://github.com/sterling-group/ChemRefine"
Documentation = "https://sterling-group.github.io/ChemRefine/"
Repository = "https://github.com/sterling-group/ChemRefine.git"
Issues = "https://github.com/sterling-group/ChemRefine/issues"

[project.scripts]
chemrefine = "chemrefine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/chemrefine"]

[tool.hatch.build.targets.sdist]
include = [
    "src/chemrefine",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Add `tests/` to sys.path so test files can `from synthetic import …`
# without making the tests directory a package.
pythonpath = ["tests"]
markers = [
    "slow: tests that take longer than 1 second",
    "gpu: tests that require CUDA",
    "integration: tests that invoke real ORCA / SLURM / external services",
]

[tool.coverage.run]
source = ["chemrefine"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.interrogate]
ignore-init-module = true
ignore-init-method = true
ignore-magic = true
ignore-nested-functions = true
fail-under = 100
exclude = ["tests", "Examples", "build", "dist"]
