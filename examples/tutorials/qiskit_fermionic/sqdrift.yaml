template_dir: ../qiskit_sp/templates
output_dir: ./outputs_sqdrift
input: ../qiskit_sp/h2.xyz
charge: 0
multiplicity: 1
max_cores: 1
dispatch: local

steps:
  - step: 1
    name: sqdrift_h2
    engine: qiskit
    operation: sp
    options:
      basis: sto-3g
      cores: 1
      algorithm:
        name: sqdrift
        options:
          times: [0.5, 1.0]
          num_groups: 20
          randomizations: 4
          shots: 1024
          samples_per_batch: 4
          num_batches: 1
          max_iterations: 3
          max_subspace_dimension: 16
          configuration_recovery: false
          seed: 17
      sampler:
        name: statevector
        options:
          seed: 17
