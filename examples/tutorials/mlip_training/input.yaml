# MLIP training: GOAT → NMS augmentation → DFT labels → train a MACE model → refine.
template_dir: ./templates
scratch_dir: /scratch/
output_dir: ./outputs
executables: { orca: /orca }

charge: 0
multiplicity: 1

# Optional: override the default initial structure (default: template_dir/step1.xyz).
input: ./step1.xyz

steps:
  # GOAT conformer search; keep the 15 lowest as the training-set backbone.
  - step: 1
    operation: goat
    engine: orca
    sample: { method: min, count: 15 }

  # Augment the dataset with normal-mode-sampled geometries: `target: random`
  # draws displacements along real modes. count: 0 keeps every structure.
  - step: 2
    operation: opt_sp
    engine: orca
    nms: true
    options: { target: random, displacement_value: 1.0, num_random_displacements: 1 }
    sample: { method: min, count: 0 }

  # DFT labels (energies + forces) for training.
  - step: 3
    operation: opt_sp
    engine: orca
    sample: { method: min, count: 0 }

  # Fine-tune a MACE model on those labels. `task_name` picks the library that trains
  # (the same word that picks the one that runs); `model_name` is the foundation model
  # it starts from. Both, and `device`, are required — there is no default worth
  # guessing for any of them. The step4.yaml template is MACE's own training config.
  # The structures pass through unchanged, so step 5 still gets all of them.
  - step: 4
    engine: mlip-train
    options: { task_name: mace_off, model_name: medium, device: cuda }
    sample: { method: min, count: 0 }

  # Validate the trained model via the MLIP gradient server. The model's path is
  # predictable before the training has run — `<step dir>/train/train[_stagetwo].model` —
  # so it can be written here. `task_name` is the same word step 4 trained with: it names
  # the library, and `model_path` only says to take that library's weights from a file.
  # Retraining step 4 re-runs this step: its cache key covers the model's contents.
  - step: 5
    operation: opt_sp
    engine: mlip-extopt
    options:
      task_name: mace_off
      model_path: ./outputs/step4/train/train_stagetwo.model
      device: cuda
    sample: { method: min, count: 0 }
