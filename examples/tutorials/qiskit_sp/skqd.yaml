template_dir: ./templates
output_dir: ./outputs_skqd
input: ./h2.xyz
charge: 0
multiplicity: 1
max_cores: 1
dispatch: local
steps:
  - step: 1
    name: sampled_krylov
    engine: qiskit
    operation: sp
    options:
      basis: sto-3g
      algorithm:
        name: skqd
        options:
          time_step: 1.0
          num_steps: 3
          product_formula: suzuki
          suzuki_order: 2
          repetitions: 2
          shots: 512
          samples_per_batch: 4
          num_batches: 1
          max_iterations: 2
          orbital_optimization:
            max_iterations: 2
            complex_rotations: false
      sampler:
        name: statevector
        options:
          seed: 4
      cores: 1
