template_dir: ./templates
output_dir: ./outputs_ceo_qnspsa
input: ./h2.xyz
charge: 0
multiplicity: 1
max_cores: 1
dispatch: local
steps:
  - step: 1
    name: coupled_exchange_natural_gradient
    engine: qiskit
    operation: sp
    options:
      basis: sto-3g
      algorithm:
        name: ceo_adapt
        options: {max_iterations: 10, max_evaluations: 2000}
      ansatz: ceo
      estimator: statevector
      sampler:
        name: statevector
        options: {seed: 3}
      optimizer:
        name: qnspsa
        options:
          maxiter: 100
          learning_rate: 0.15
          perturbation: 0.1
          blocking: true
          allowed_increase: 0.001
          fidelity_shots: 4096
          seed: 12
      initial_point: zeros
      cores: 1
