# Every rev below is pinned to a full commit SHA with the release tag in a
# trailing `# frozen:` comment — the same discipline as the SHA-pinned actions
# in .github/workflows/, and for the same reason: a tag is mutable, and these
# repos' code executes on every contributor machine (`pre-commit install` is
# required) as well as in CI. `pre-commit autoupdate --freeze` writes this
# format.
#
# The pre-commit.ci app keeps the pins current — Dependabot cannot, pre-commit
# is not one of its ecosystems — and its autoupdate PRs preserve the frozen-SHA
# format, so the pin costs no freshness.
ci:
  autoupdate_schedule: monthly
  autoupdate_commit_msg: "ci: autoupdate pre-commit hooks"
  # No fix commits pushed onto PR branches: hook failures are the author's to
  # fix, and `git log` stays free of bot-authored commits. The app still
  # reports the hooks as a PR status and still opens the autoupdate PRs.
  autofix_prs: false

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 7c55798a78262d14b2074abf623d8a992ebb70d4  # frozen: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/econchick/interrogate
    rev: a6268877efd41a21197445cc04cbf28f9c6facba  # frozen: 1.7.0
    hooks:
      - id: interrogate
        args: [src/chemrefine/, -v, --fail-under=100]
        pass_filenames: false

  # Biome is ruff's opposite number for the GUI: it formats the JavaScript and CSS and
  # lints all three languages, for a layer that had a syntax check and nothing else.
  # `language: node` — the only non-Python hook here — so pre-commit uses the system Node
  # where there is one (CI runners) and downloads one with nodeenv where there is not.
  # No setup-node step in ci.yml, and nothing for a contributor to install.
  #
  # No `additional_dependencies`, despite the hook's README: this repo pins
  # `@biomejs/biome` exactly in its own package.json and cuts one tag per Biome release,
  # so the frozen SHA below *is* the version pin — and unlike additional_dependencies it
  # is the thing pre-commit.ci's autoupdate maintains. Naming the version twice would
  # leave one copy the bot bumps and one it never touches.
  - repo: https://github.com/biomejs/pre-commit
    rev: 3a0c6458e3d46fb8d931600cd3970f2053768ce3  # frozen: v2.5.9
    hooks:
      - id: biome-check
        # `biome check --write` is format + lint + fix, the same shape as the ruff hook's
        # --fix above: a violation is written and the run then fails on the modified file.
        #
        # `files` is replaced rather than extended. The published regex has no `html`
        # branch, so index.html — where every Alpine binding lives — would never reach the
        # linter; and this repository has four frontend files and no other JS or JSON
        # Biome should touch.
        files: ^src/chemrefine/gui/static/.*\.(js|css|html)$
        # biome.jsonc's `!vendor/**` does not filter paths passed on the command line
        # (biomejs/biome#7268) and pre-commit always passes paths, so the vendored bundles
        # are excluded here or not at all. Formatting them would break the byte-for-byte
        # match with the published CDN copy, which is the only way `test_the_javascript_
        # parses` can tell a tampered download from a working one.
        exclude: ^src/chemrefine/gui/static/vendor/
