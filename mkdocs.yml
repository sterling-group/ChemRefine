site_name: ChemRefine
site_description: Automated, interoperable manager for computational-chemistry workflows
site_url: https://sterling-group.github.io/ChemRefine/
repo_url: https://github.com/sterling-group/ChemRefine
repo_name: sterling-group/ChemRefine
copyright: Copyright &copy; 2026 Sterling Group

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

# A module whose API page is missing produces no warning by default, and an orphaned page
# is only INFO — neither reaches `--strict`, which promotes warnings. Raising both to
# `warn` makes `mkdocs build --strict` the gate that catches a page added without a nav
# entry, or a nav entry pointing at nothing.
validation:
  nav:
    omitted_files: warn
    not_found: warn

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            # ChemRefine docstrings are numpy-style (see throttle.py et al.) —
            # do NOT switch to google; interrogate + these renders expect numpy.
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            merge_init_into_class: true
            show_if_no_docstring: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        # Render ```mermaid blocks as diagrams (mkdocs-material ships the JS).
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.snippets:
      # Lets docs/changelog.md include the repo-root CHANGELOG.md (single source).
      base_path: ["."]
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/site-title.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
