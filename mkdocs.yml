site_name: ChemRefine
site_description: Automated, interoperable manager for computational-chemistry workflows
site_url: https://sterling-group.github.io/ChemRefine/
repo_url: https://github.com/sterling-group/ChemRefine
repo_name: sterling-group/ChemRefine
copyright: Copyright &copy; 2026 Sterling Group

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

# A module whose API page is missing produces no warning by default, and an orphaned page
# is only INFO — neither reaches `--strict`, which promotes warnings. Raising both to
# `warn` makes `mkdocs build --strict` the gate that catches a page added without a nav
# entry, or a nav entry pointing at nothing.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  # A link to a heading that no longer exists is only INFO by default, so `--strict` —
  # which promotes warnings — walked straight past two of them the moment a section was
  # renamed. Raising anchors and unrecognized_links makes the build the gate for the
  # *inside* of a link, as `not_found` already is for the file half.
  links:
    anchors: warn
    unrecognized_links: warn

# The hooks live under docs/ but are build machinery, not content: without this they are
# copied into the site as static assets, __pycache__ and all. MkDocs loads them from the
# path below rather than from the docs collection, so excluding them changes nothing else.
exclude_docs: |
  hooks/
  _includes/

# tables.py fills the `<!-- chemrefine:… -->` directives from the registry, so no page
# hand-maintains a list of engines, backends or extras. playground.py runs post-build to
# copy the GUI assets to site/playground/ with a baked schema.json, so the workflow
# builder is usable on the published docs (static mode: build + copy/download).
hooks:
  - docs/hooks/tables.py
  - docs/hooks/playground.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            # ChemRefine docstrings are numpy-style (see throttle.py et al.) —
            # do NOT switch to google; interrogate + these renders expect numpy.
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            merge_init_into_class: true
            show_if_no_docstring: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        # Render ```mermaid blocks as diagrams (mkdocs-material ships the JS).
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.snippets:
      # Lets a docs page include a repo-root file (CHANGELOG.md, CONTRIBUTING.md,
      # SECURITY.md) or a named section of one (README.md's hero/requirements/…).
      base_path: ["."]
      # Without this a missing file *or* a missing `[start:name]` section renders as an
      # empty string and the build passes — so renaming CHANGELOG.md would publish a
      # blank page. This is the guard for every include; it needs no test.
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/site-title.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

