# ChemRefine v2 example workflow
# Replace the path placeholders with paths on your system.
template_dir: ./templates
scratch_dir:  ./scratch
output_dir:   ./outputs
executables: { orca: orca }

# Initial seed: either an .xyz, a directory of .xyz files, or a CSV of SMILES.
input: ./templates/step1.xyz

charge: 0
multiplicity: 1
max_cores: 64
slurm_template: cpu.slurm.header

steps:
  # Step 1 — cheap conformer generation with an MLFF surrogate.
  - step: 1
    name: screen
    engine: mlip
    operation: opt_sp
    options:
      model_name: medium
      task_name: mace_off
      device: cuda
    sample:
      method: boltzmann
      percent_cumulative: 99

  # Step 2 — refine survivors with DFT.
  - step: 2
    name: dft_refine
    engine: orca
    operation: opt_sp
    template: dft_opt.inp
    sample:
      method: energy_window
      window_kcal: 3.0

  # Step 3 — high-precision DFT on the survivors of step 2.
  - step: 3
    name: high_level
    engine: orca
    operation: opt_sp
    template: dft_high.inp
    sample:
      method: integer
      count: 5
    nms: true
