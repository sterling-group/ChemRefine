# Conformational sampling: a GOAT ensemble, then MLIP + DFT refinement.
template_dir: ./templates
scratch_dir: /scratch/
output_dir: ./outputs
executables: { orca: /orca }

charge: 0
multiplicity: 1

# Optional: override the default initial structure (default: template_dir/step1.xyz).
input: ./step1.xyz

steps:
  # GOAT conformer search (XTB); keep the 15 lowest-energy conformers.
  - step: 1
    operation: goat
    engine: orca
    sample: { method: min, count: 15 }

  # Refine the ensemble with an MLIP gradient server (ORCA-driven).
  - step: 2
    operation: opt_sp
    engine: mlip-extopt
    options: { model_name: uma-s-1, task_name: omol, device: cuda }
    sample: { method: min, count: 15 }

  # Level-of-theory ladder: each step re-optimises with a better functional/basis.
  - step: 3
    operation: opt_sp
    engine: orca
    sample: { method: min, count: 15 }

  - step: 4
    operation: opt_sp
    engine: orca
    sample: { method: min, count: 15 }

  - step: 5
    operation: opt_sp
    engine: orca
    sample: { method: min, count: 15 }
