# MLIP training: GOAT → NMS augmentation → DFT labels → train a MACE model → refine.
template_dir: ./templates
scratch_dir: /scratch/
output_dir: ./outputs
executables: { orca: /orca }

charge: 0
multiplicity: 1

# Optional: override the default initial structure (default: template_dir/step1.xyz).
input: ./templates/step1.xyz

steps:
  # GOAT conformer search; keep the 15 lowest as the training-set backbone.
  - step: 1
    operation: goat
    engine: orca
    sample: { method: min, count: 15 }

  # Augment the dataset with normal-mode-sampled geometries: `target: random`
  # draws displacements along real modes. count: 0 keeps every structure.
  - step: 2
    operation: opt_sp
    engine: orca
    nms: true
    options: { target: random, displacement_value: 1.0, num_random_displacements: 1 }
    sample: { method: min, count: 0 }

  # DFT labels (energies + forces) for training.
  - step: 3
    operation: opt_sp
    engine: orca
    sample: { method: min, count: 0 }

  # Train a MACE model; the step4.inp template is the raw MACE training YAML.
  - step: 4
    engine: mlip-train
    operation: mlip_train
    sample: { method: min, count: 0 }

  # Validate the trained model via the MLIP gradient server.
  - step: 5
    operation: opt_sp
    engine: mlip-extopt
    options:
      model_name: ../step4/checkpoints_dir/goat_model_run-123_stagetwo.model
      task_name: mace_off
      device: cuda
    sample: { method: min, count: 0 }
