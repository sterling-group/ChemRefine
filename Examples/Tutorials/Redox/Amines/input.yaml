# Redox potentials for a set of amines (SMILES input) across charge/spin states.
template_dir: ./templates
scratch_dir: /scratch/
output_dir: ./outputs3
executables: { orca: /orca }

charge: 0
multiplicity: 1

# Initial structures come from a CSV of SMILES (one column named `smiles`).
input: ./templates/oxidation_smiles.csv

steps:
  - step: 1
    operation: opt_sp
    engine: orca
    sample: { method: boltzmann, percent_cumulative: 99 }

  - step: 2
    operation: opt_sp
    engine: mlip-extopt
    options: { model_name: uma-s-1, task_name: omol, device: cuda }
    sample: { method: min, count: 0 }

  - step: 3
    operation: opt_sp
    engine: mlip-extopt
    charge: -1
    multiplicity: 2
    options: { model_name: uma-s-1, task_name: omol, device: cuda }
    sample: { method: min, count: 0 }

  - step: 4
    operation: opt_sp
    engine: mlip-extopt
    charge: 0
    multiplicity: 1
    options: { model_name: uma-s-1, task_name: omol, device: cuda }
    sample: { method: min, count: 0 }

  - step: 5
    operation: opt_sp
    engine: orca
    charge: -1
    multiplicity: 2
    sample: { method: min, count: 0 }

  - step: 6
    operation: opt_sp
    engine: orca
    charge: 0
    multiplicity: 1
    sample: { method: min, count: 0 }

  - step: 7
    operation: opt_sp
    engine: orca
    charge: 1
    multiplicity: 2
    sample: { method: min, count: 0 }

  - step: 8
    operation: opt_sp
    engine: mlip-extopt
    charge: 1
    multiplicity: 2
    options: { model_name: uma-s-1, task_name: omol, device: cuda }
    sample: { method: min, count: 0 }
