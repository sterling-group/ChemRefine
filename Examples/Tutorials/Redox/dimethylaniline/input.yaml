# Redox properties of dimethylaniline: GOAT screen → DFT → MLIP/DFT charge states.
template_dir: ./templates
scratch_dir: /scratch/
output_dir: ./outputs
executables: { orca: /orca }

charge: 0
multiplicity: 1

# Optional: override the default initial structure (default: template_dir/step1.xyz).
input: ./templates/step1.xyz

steps:
  - step: 1
    operation: goat
    engine: orca
    sample: { method: boltzmann, percent_cumulative: 95 }

  - step: 2
    operation: opt_sp
    engine: orca
    sample: { method: energy_window, window_kcal: 10 }

  - step: 3
    operation: opt_sp
    engine: mlip-extopt
    charge: -1
    multiplicity: 2
    options: { model_name: uma-s-1, task_name: omol, device: cuda }
    sample: { method: integer, count: 0 }

  - step: 4
    operation: opt_sp
    engine: mlip-extopt
    charge: 0
    multiplicity: 1
    options: { model_name: uma-s-1, task_name: omol, device: cuda }
    sample: { method: integer, count: 0 }

  - step: 5
    operation: opt_sp
    engine: mlip-extopt
    charge: 1
    multiplicity: 2
    options: { model_name: uma-s-1, task_name: omol, device: cuda }
    sample: { method: integer, count: 0 }

  - step: 6
    operation: opt_sp
    engine: orca
    charge: -1
    multiplicity: 2
    sample: { method: integer, count: 0 }

  - step: 7
    operation: opt_sp
    engine: orca
    charge: 0
    multiplicity: 1
    sample: { method: integer, count: 0 }

  - step: 8
    operation: opt_sp
    engine: orca
    charge: 1
    multiplicity: 2
    sample: { method: integer, count: 0 }
