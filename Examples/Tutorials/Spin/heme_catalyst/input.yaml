# Heme catalyst spin-state ladder: optimise (DFT) then refine (MLIP) across 5/3/1.
template_dir: ./templates
scratch_dir: /scratch/
output_dir: ./outputs
executables: { orca: /orca }

charge: 0
multiplicity: 5

# Optional: override the default initial structure (default: template_dir/step1.xyz).
input: ./templates/step1.xyz

steps:
  - step: 1
    operation: opt_sp
    engine: orca
    sample: { method: min, count: 0 }

  - step: 2
    operation: opt_sp
    engine: orca
    charge: 0
    multiplicity: 5
    sample: { method: min, count: 0 }

  - step: 3
    operation: opt_sp
    engine: orca
    charge: 0
    multiplicity: 3
    sample: { method: min, count: 0 }

  - step: 4
    operation: opt_sp
    engine: orca
    charge: 0
    multiplicity: 1
    sample: { method: min, count: 0 }

  - step: 5
    operation: opt_sp
    engine: mlip-extopt
    charge: 0
    multiplicity: 5
    options: { model_name: uma-s-1, task_name: omol, device: cuda }
    sample: { method: min, count: 0 }

  - step: 6
    operation: opt_sp
    engine: mlip-extopt
    charge: 0
    multiplicity: 3
    options: { model_name: uma-s-1, task_name: omol, device: cuda }
    sample: { method: min, count: 0 }

  - step: 7
    operation: opt_sp
    engine: mlip-extopt
    charge: 0
    multiplicity: 1
    options: { model_name: uma-s-1, task_name: omol, device: cuda }
    sample: { method: min, count: 0 }
