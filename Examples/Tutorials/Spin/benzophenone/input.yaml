template_dir: ./templates
scratch_dir: /scratch/
output_dir: ./outputs
orca_executable: /orca

charge: 0
multiplicity: 1

# Optional: Override default initial structure (default is /template_dir/step1.xyz)
initial_xyz: ./templates/step1.xyz

steps:
  - step: 1
    engine: "DFT"
    operation: "OPT+SP"
    sample_type:
      method: "energy_window"
      parameters:
        energy: 10
        unit: kcal/mol

  # Step 2: Using MLFF to refine the calculation
  - step: 2
    engine: "MLFF"
    operation: "OPT+SP"
    mlff:
      model_name: "uma-s-1"
      task_name: "omol"
      device: "cuda"
    sample_type:
      method: "boltzmann"
      parameters:
        weight: 95

  - step: 3
    engine: "DFT"
    operation: "OPT+SP"
    sample_type:
      method: "integer"
      parameters:
        num_structures: 3

  - step: 4
    engine: "DFT"
    operation: "OPT+SP"
    sample_type:
      method: "integer"
      parameters:
        num_structures: 1

  - step: 5
    engine: "DFT"
    operation: "OPT+SP"
    charge: 0
    multiplicity: 1
    sample_type:
      method: "integer"
      parameters:
        num_structures: 0

  - step: 6
    engine: "DFT"
    operation: "OPT+SP"
    charge: 0
    multiplicity: 3
    sample_type:
      method: "integer"
      parameters:
        num_structures: 0

  - step: 7
    engine: "DFT"
    operation: "OPT+SP"
    charge: 0
    multiplicity: 1
    sample_type:
      method: "integer"
      parameters:
        num_structures: 0
