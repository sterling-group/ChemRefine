# Benzophenone spin states: DFT/MLIP screen, then singlet/triplet refinement.
template_dir: ./templates
scratch_dir: /scratch/
output_dir: ./outputs
executables: { orca: /orca }

charge: 0
multiplicity: 1

# Optional: override the default initial structure (default: template_dir/step1.xyz).
input: ./templates/step1.xyz

steps:
  - step: 1
    engine: orca
    operation: opt_sp
    sample: { method: energy_window, window_kcal: 10 }

  # Refine with an MLIP gradient server (ORCA-driven).
  - step: 2
    engine: mlip-extopt
    operation: opt_sp
    options: { model_name: uma-s-1, task_name: omol, device: cuda }
    sample: { method: boltzmann, percent_cumulative: 95 }

  - step: 3
    engine: orca
    operation: opt_sp
    sample: { method: integer, count: 3 }

  - step: 4
    engine: orca
    operation: opt_sp
    sample: { method: integer, count: 1 }

  - step: 5
    engine: orca
    operation: opt_sp
    charge: 0
    multiplicity: 1
    sample: { method: integer, count: 0 }

  - step: 6
    engine: orca
    operation: opt_sp
    charge: 0
    multiplicity: 3
    sample: { method: integer, count: 0 }

  - step: 7
    engine: orca
    operation: opt_sp
    charge: 0
    multiplicity: 1
    sample: { method: integer, count: 0 }
