# Host–guest docking + microsolvation, refined with MLIP and DFT.
template_dir: ./templates
scratch_dir: /scratch/
output_dir: ./outputs
executables: { orca: /orca }

charge: 0
multiplicity: 1

input: ./templates/step1.xyz

steps:
  # Generate docking poses of the guest in the host cavity.
  - step: 1
    operation: docker
    engine: orca
    sample: { method: min, count: 5 }

  # Refine with an MLIP gradient server (ORCA-driven).
  - step: 2
    operation: opt_sp
    engine: mlip-extopt
    options: { model_name: uma-s-1, task_name: omol, device: cuda }
    sample: { method: min, window_kcalmol: 10 }

  - step: 3
    operation: opt_sp
    engine: orca
    charge: -1
    multiplicity: 1
    sample: { method: min, count: 1 }

  - step: 4
    operation: solvator
    engine: orca
    sample: { method: min, count: 0 }

  - step: 5
    operation: opt_sp
    engine: orca
    charge: -1
    multiplicity: 1
    sample: { method: min, window_kcalmol: 10 }
