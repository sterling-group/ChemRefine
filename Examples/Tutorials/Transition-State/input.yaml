# Transition-state search: PES scan → optimise → normal-mode sampling.
template_dir: ./templates
scratch_dir: /scratch/
output_dir: ./outputs
executables: { orca: /orca/orca_6_1_0_avx2/orca }

charge: 0
multiplicity: 1

# Optional: override the default initial structure (default: template_dir/step1.xyz).
input: ./templates/step1.xyz

steps:
  - step: 1
    operation: pes
    engine: orca
    sample: { method: max, count: 5 }

  - step: 2
    operation: opt_sp
    engine: orca
    sample: { method: min, count: 5 }

  # Normal-mode sampling: keep exactly one imaginary mode (a first-order saddle).
  - step: 3
    operation: opt_sp
    engine: orca
    nms: true
    options: { target: ts, displacement_value: 1.0 }
    sample: { method: min, count: 3 }

  - step: 4
    operation: opt_sp
    engine: orca
    sample: { method: min, count: 1 }
