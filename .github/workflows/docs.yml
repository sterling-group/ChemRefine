name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the GitHub Actions Pages deployment: read the repo here, and
# only the deploy job may write the Pages artifact and mint the OIDC token
# `deploy-pages` needs. Not `mkdocs gh-deploy --force`: it needs `contents: write`,
# an over-broad grant here, because the docs build runs mkdocstrings, which imports
# chemrefine and its dependencies — repo and dependency code would run under a
# token allowed to push to any branch. The same reasoning scopes the remaining two
# grants to the job that uses them: the build job runs that same code, and has no
# use for a token that can publish the site.
#
# Requires the repository's Pages source to be set to "GitHub Actions"
# (Settings → Pages), not the legacy gh-pages branch.
permissions:
  contents: read

# Allow one concurrent deployment; don't cancel an in-progress one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Must match ci.yml's docs-check. mkdocs --strict fails on warnings, and
      # mkdocstrings renders live signatures, so a different Python here could pass
      # in PR and then fail on deploy — after merge, when nobody is looking.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[docs]"

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
