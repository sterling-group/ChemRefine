name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, on what `main` holds. Every job below installs today's releases of what it
  # needs, so a release of somebody else's package can break one with no commit of ours,
  # and without this the first to find out is the next pull request, whose author changed
  # nothing that matters. Monday, ahead of the week's other sweeps.
  schedule:
    - cron: "47 2 * * 1"
  # Re-run the matrix without needing a push (a flaky runner, a dependency that
  # just published a fix).
  workflow_dispatch:
  # Callable from publish.yml, so a release runs this whole file rather than a
  # reduced copy of it. Nothing that gates a merge should be absent from the path
  # that ships a wheel to PyPI.
  workflow_call:

permissions:
  contents: read

# One run at a time per ref. On a pull request a newer push supersedes the run in flight:
# only the newest head matters there. Anywhere else — a push to main, the weekly run, a
# manual one, a release calling this file — a run in flight is never cut short, and a
# later one waits for it: a cancelled run reads as a failed one, on a commit that has
# nothing wrong with it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  # The tests that execute the GUI's JavaScript skip without a Node, and a skip
  # exits 0 — so they can stop testing anything without a red build. This catches a runner
  # image dropping Node, not a regression in our own lookup: runners ship one, so every
  # job here takes the PATH branch. The step that exercises the *other* branch is in the
  # `test` job below.
  CHEMREFINE_REQUIRE_NODE: "1"

# Every `uses:` is pinned to a full commit SHA with the release tag in a trailing
# comment. Tags are mutable — a compromised maintainer account can re-point `v1`
# at any commit, which is how the tj-actions/changed-files attack leaked CI
# secrets from every repo tracking a tag. Dependabot reads the trailing comment
# and rewrites both SHA and comment on an update, so pinning costs no freshness.
#
# `persist-credentials: false` on every checkout: no job here pushes, so the
# GITHUB_TOKEN must not be left behind in .git/config where a later step — or a
# compromised dependency — could use it.
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      # The hooks are run here rather than through pre-commit/action, whose own steps these
      # two are: that action reaches `actions/cache` by a tag, and no action runs in this
      # repository, nested or not, that is not pinned to a commit. `[dev]` brings pre-commit.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run the hooks
        run: pre-commit run --show-diff-on-failure --color=always --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Run tests with coverage
        run: pytest --cov=chemrefine --cov-report=term-missing --cov-report=xml --cov-fail-under=100 -q

      # 100% -> 100% over a different set of lines is invisible in the gate alone;
      # keeping the report makes a drop reviewable after the fact.
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

      # The bundled Node is the branch every machine *without* one depends on, and nothing
      # above executes it: `shutil.which("node")` always wins on a runner. Reducing PATH to
      # the interpreter's own bin directory hides the system Node, and the wheel installs
      # no console script, so nothing puts one back. Without this step
      # CHEMREFINE_REQUIRE_NODE is decorative — it could only fire if the image lost Node.
      - name: The bundled Node stands in when PATH has none
        run: |
          PY="$(command -v python)"
          PATH="$(dirname "$PY")" "$PY" -m pytest tests/test_gui_assets.py -q

  # Every extra is a promise the resolver has to be able to keep. The test job only installs
  # [test], so without this job a broken extra — a bad pin, a missing marker — would reach
  # users rather than CI. Resolution only: the heavy backends are never downloaded.
  extras-resolve:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The mlip-* extras are the likeliest thing here to rot — they carry an exact `e3nn`
      # pin, a ceiling on `torch` and `python_version` markers on the backends — and a
      # broken one reaches users by both supported routes: `pip install chemrefine[mlip]`
      # into their own environment (the first backend can share it), and `chemrefine
      # backends install <extra>`, which resolves the same requirement into a fresh env.
      # Resolution only: metadata is fetched, no torch wheel is downloaded (~10s each).
      - name: Resolve every declared extra
        run: |
          pip install --upgrade pip
          # Read the extras out of the metadata that declares them rather than restating
          # them here: a hand-written list drifts, and an extra missing from it is a
          # promise this job never checks. tomllib is stdlib on every matrix Python.
          extras=$(python -c "import tomllib;print(' '.join(sorted(tomllib.load(open('pyproject.toml','rb'))['project']['optional-dependencies'])))")
          echo "resolving: $extras"
          for extra in $extras; do
            echo "::group::[$extra]"
            pip install --dry-run --quiet ".[$extra]"
            echo "::endgroup::"
          done

      # `mlip-orb` carries `python_version >= '3.12'`. On 3.11 the marker must exclude
      # orb-models outright; without it pip backtracks through every orb release looking
      # for a compatible one and ends in a resolver wall of text instead of a clear
      # "requires a different Python". Nothing else would notice that marker regressing.
      - name: The mlip-orb marker must exclude orb-models on 3.11
        if: matrix.python-version == '3.11'
        run: |
          pip install --dry-run --quiet --report orb.json ".[mlip-orb]"
          python - <<'PY'
          import json, sys
          report = json.load(open("orb.json"))
          names = {p["metadata"]["name"].lower() for p in report["install"]}
          if "orb-models" in names:
              sys.exit("orb-models resolved on 3.11 — the version marker is not holding")
          print("marker holds: orb-models excluded on 3.11")
          PY

      # A `python_version` ceiling on a backend extra is a claim about what its backend offers
      # there, and the way it rots is by being *fixed upstream*: the wheel that was missing is
      # published, or the backend starts naming the Python it stopped at, and the cap goes on
      # excluding a Python that works, silently, forever. Nobody re-checks a pin that is not
      # failing. So the cap is asked, on every matrix Python above it, whether it is still
      # buying anything.
      #
      # Which extras are capped, and what each cap holds back, come out of pyproject —
      # nothing is named here. A backend added or re-capped later is covered on the commit
      # that changes the marker, with no matching edit to this file.
      #
      # A cap holds for one of three reasons, asked in turn. The first is that the held-back
      # requirement itself has no wheel here: `--only-binary` names it, never `:all:`, because
      # resolution is transitive, and a wheels-only rule over the whole tree fails on mace's
      # `python-hostlist` and chgnet's `nvidia-ml-py3` — source-only pure-Python packages
      # that build in a second anywhere — *regardless* of whether the capped package gained
      # wheels, so the reminder could never fire for those two extras.
      #
      # The second is that the backend stops there by its own word: a held-back package whose
      # classifiers name the newest Python the extra claims and do not name this one.
      # mace-torch installs on 3.14 from wheels and names nothing past 3.13, since torch does
      # not support TorchScript there. A package that names neither Python says nothing
      # either way — e3nn 0.4.4 names none past 3.10 — and is not asked.
      #
      # The third is a native build behind the requirement, which the resolution cannot show:
      # `--dry-run` prepares metadata, and a source archive yields metadata without compiling
      # anything.
      # orb-models is a pure wheel on every Python, and its cap is for the `dm-tree==0.1.8` it
      # pins, whose vendored abseil is what would compile for an hour. So what the resolution
      # would install is read off pip's report, and each package it takes as a source archive
      # is asked for again as a wheel for the newest Python the extra claims. One that has a
      # wheel there is a native build here, and the cap holds; one that has no wheel on any
      # Python is the bystander of the first reason, and is passed over.
      #
      # Ceilings only. A floor is policy rather than a wheel fact — orb-models resolves fine
      # below its floor, to a 2024 release, which is what the floor refuses — and the step
      # above holds that one.
      - name: No capped extra has outlived its cap
        run: |
          pip install --quiet packaging
          python - <<'PY'
          import json, subprocess, sys, tempfile, tomllib
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name

          here = f"{sys.version_info.major}.{sys.version_info.minor}"

          def minor(version):
              return int(version.split(".")[1])

          def dry_run(*args):
              return subprocess.run(
                  [sys.executable, "-m", "pip", "install", "--dry-run", *args],
                  capture_output=True, text=True,
              )

          def pythons_named(metadata):
              return {c.rsplit(" ", 1)[1] for c in metadata.get("classifier", [])
                      if c.startswith("Programming Language :: Python :: 3.")}

          def stops_before_here(report, names, claimed):
              """The held-back packages whose classifiers name `claimed` and not this Python."""
              return [
                  f"{item['metadata']['name']} {item['metadata']['version']}"
                  for item in json.load(open(report))["install"]
                  if canonicalize_name(item["metadata"]["name"]) in names
                  and claimed in (named := pythons_named(item["metadata"]))
                  and here not in named
              ]

          def built_here(report, claimed):
              """What pip would build from source here although `claimed` has a wheel for it."""
              built = []
              for item in json.load(open(report))["install"]:
                  if item["download_info"]["url"].endswith(".whl"):
                      continue
                  pin = f"{item['metadata']['name']}=={item['metadata']['version']}"
                  as_a_wheel = dry_run("--quiet", "--no-deps", "--only-binary", ":all:",
                                       "--python-version", claimed, pin)
                  if as_a_wheel.returncode == 0:
                      built.append(pin)
              return built

          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          candidates = sorted(
              {c.rsplit(" ", 1)[1] for c in project["classifiers"]
               if c.startswith("Programming Language :: Python :: 3.")},
              key=minor,
          )
          extras = project["optional-dependencies"]

          def applicable(extra, version):
              """This extra's own requirements on that Python — self-references dropped."""
              env = {"extra": extra, "python_version": version,
                     "python_full_version": f"{version}.0"}
              return [
                  r for raw in extras[extra]
                  if (r := Requirement(raw)).name != "chemrefine"
                  and (r.marker is None or r.marker.evaluate(env))
              ]

          problems = []
          for extra in sorted(extras):
              named = {v: {r.name for r in applicable(extra, v)} for v in candidates}
              full = set().union(*named.values())
              claimed = [v for v in candidates if named[v] == full]
              if not claimed:
                  problems.append(f"[{extra}] installs on no supported Python at all")
                  continue
              if len(claimed) == len(candidates) or minor(here) <= minor(claimed[-1]):
                  continue          # uncapped, or this Python is inside what it claims
              held_back = [
                  str(r).split(";")[0].strip()
                  for r in applicable(extra, claimed[-1])
                  if r.name not in named[here]
              ]
              wheels_only = ",".join(Requirement(spec).name for spec in held_back)
              names = {canonicalize_name(name) for name in wheels_only.split(",")}
              print(f"::group::[{extra}] claims {claimed}; on {here} it holds back {held_back}")
              with tempfile.TemporaryDirectory() as tmp:
                  report = f"{tmp}/report.json"
                  done = dry_run("--report", report, "--only-binary", wheels_only, *held_back)
                  print(done.stdout or done.stderr)
                  resolved = done.returncode == 0
                  stops = stops_before_here(report, names, claimed[-1]) if resolved else []
                  built = built_here(report, claimed[-1]) if resolved else []
              for name in stops:
                  print(f"{name} names Python {claimed[-1]} and not {here}")
              for pin in built:
                  print(f"{pin}: a wheel on {claimed[-1]}, a source build on {here}")
              print("::endgroup::")
              if resolved and not stops and not built:
                  problems.append(
                      f"[{extra}] excludes Python {here}, but {' '.join(held_back)} now "
                      f"installs there from wheels — the cap has outlived its reason. Lift "
                      f"it in pyproject.toml (and check the comment that explains it)."
                  )
          if problems:
              sys.exit("\n".join(problems))
          print(f"every cap still binds on {here}")
          PY

  # extras-resolve proves the declared versions *resolve*; this job proves the floors
  # *run*. Every other job tests whatever pip picks today — always the newest allowed —
  # so a floor could sit years behind the first version the code actually needs and the
  # matrix would stay green until a distro or a cluster site pinned low and hit it.
  # This installs exactly the declared minima and runs the suite on them, on the oldest
  # supported Python, where the floors bind. A floor this job fails is a wrong floor:
  # raise it in pyproject rather than loosening anything here.
  floors:
    name: Suite passes on the dependency floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Pin every runtime dependency to its floor
        # Read the floors out of the metadata that declares them, like extras-resolve
        # does — a hand-written pin list here would drift the moment a floor moved.
        # Runtime deps only: the test tools float, because the promise under test is
        # what `pip install chemrefine` guarantees users, not what pytest needs.
        # Parsed with the requirement grammar rather than a regex: a `,<3` or a marker is
        # read for what it is, and an entry with no `>=` floor fails the job here instead of
        # vanishing from the pin list while the job stays green.
        run: |
          python -m pip install --quiet packaging
          python - <<'PY'
          import sys, tomllib
          from packaging.requirements import Requirement
          deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
          pins, floorless = [], []
          for dep in deps:
              req = Requirement(dep)
              floors = [s.version for s in req.specifier if s.operator == ">="]
              if len(floors) != 1:
                  floorless.append(dep)
                  continue
              pins.append(f"{req.name}=={floors[0]}")
          if floorless:
              sys.exit(f"every runtime dependency needs exactly one >= floor to pin: {floorless}")
          open("floors.txt", "w").write("\n".join(pins) + "\n")
          print(*pins, sep="\n")
          PY
      - name: Install the floors and the test tools
        run: pip install -e ".[test]" -c floors.txt
      - name: The suite must pass on the floors
        run: pytest -q

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: mypy
        run: mypy

  # Coverage proves every line ran; it does not prove an assertion looked at the result.
  # This breaks each predicate whose inversion would be a wrong scientific answer rather
  # than a crash, and requires a red test — so those predicates are checked, not merely
  # executed. Its own job because it runs a suite per mutation (~1.5 min: each runs the one
  # test file it names, and only a fall-back or a survivor pays for the whole suite).
  mutation-gate:
    name: Critical predicates are checked, not just covered
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: pip install -e ".[test]"
      - name: Break each critical predicate and require a red test
        run: python scripts/mutation_gate.py

  docs-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[docs]"

      - name: Docstring coverage
        run: interrogate -c pyproject.toml src/chemrefine/

      - name: Build docs
        run: mkdocs build --strict

  build-package:
    name: Build & verify package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2

  # build-and-inspect validates the metadata but never installs the result, so a
  # packaging regression — a missing py.typed, a broken console script, a module
  # left out of the wheel — would ship. Install the real artifact into a
  # clean env and use it.
  install-smoke-test:
    name: Install the built wheel
    runs-on: ubuntu-latest
    needs: build-package
    steps:
      # The tree is here for what the steps below read from it: the shipped quickstart the
      # installed CLI validates, and the project file that names the SBOM's subject. The
      # package under test is the downloaded artifact, never this checkout — the src layout
      # keeps the tree off sys.path.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Download packages built by build-and-inspect-python-package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      # `--help` proves the entry point imports; the three after it prove the package
      # works. `validate` loads the shipped quickstart through the engine registry and its
      # templates (its ORCA path is a placeholder, so it warns and exits 0), `schema`
      # prints the packaged introspection document, `engines --json` the registry.
      - name: Install the wheel and exercise the entry point
        run: |
          pip install dist/*.whl
          chemrefine --version
          chemrefine --help > /dev/null
          chemrefine validate examples/first_run/input.yaml
          chemrefine schema > /dev/null
          chemrefine engines --json > /dev/null

      # What the wheel brings with it, as a CycloneDX SBOM: the package and every
      # dependency the resolver picks for it today, which the version floors in pyproject
      # cannot say. The wheel is installed once more for it, into an environment that holds
      # nothing else — not even pip, which the interpreter above carries and which is no
      # part of this package — and the tool is kept in another, so the SBOM lists neither
      # the installer nor itself. Made here, on every run, because a release attaches this
      # file — publish.yml calls this workflow and takes the artifact from the same run —
      # and a command only a release runs is one nobody has run.
      - name: Describe what the wheel brings with it
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/installed"
          pip --python "$RUNNER_TEMP/installed/bin/python" install --quiet dist/*.whl
          python -m venv "$RUNNER_TEMP/sbom-tool"
          "$RUNNER_TEMP/sbom-tool/bin/pip" install --quiet cyclonedx-bom
          "$RUNNER_TEMP/sbom-tool/bin/cyclonedx-py" environment \
            --pyproject pyproject.toml \
            --output-format JSON \
            --output-file chemrefine-sbom.cdx.json \
            "$RUNNER_TEMP/installed/bin/python"

      # An SBOM is believed, not read, so it is asked what makes it this install's: that its
      # subject is the version installed, and that its components are the distributions the
      # environment holds beside the package, no more and no fewer.
      - name: The SBOM must describe that install
        run: |
          "$RUNNER_TEMP/installed/bin/python" - <<'PY'
          import json, sys
          from importlib.metadata import distributions, version
          from packaging.utils import canonicalize_name

          bom = json.load(open("chemrefine-sbom.cdx.json"))
          subject = bom.get("metadata", {}).get("component") or {}
          named = (subject.get("name"), subject.get("version"))
          listed = {canonicalize_name(c["name"]) for c in bom.get("components", [])}
          held = {canonicalize_name(d.metadata["Name"]) for d in distributions()} - {"chemrefine"}
          problems = []
          if (canonicalize_name(named[0] or ""), named[1]) != ("chemrefine", version("chemrefine")):
              problems.append(
                  f"its subject is {named[0]} {named[1]}, and chemrefine "
                  f"{version('chemrefine')} is what is installed"
              )
          if listed - held:
              problems.append(f"it lists {sorted(listed - held)}, which the install does not hold")
          if held - listed:
              problems.append(f"it leaves out {sorted(held - listed)}, which the install holds")
          if problems:
              sys.exit("the SBOM does not describe this install: " + "; ".join(problems))
          print(f"the SBOM is of chemrefine {named[1]} and the {len(listed)} distributions installed with it")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SBOM
          path: chemrefine-sbom.cdx.json
          if-no-files-found: error

      # The sdist is the second artifact PyPI serves, and a distro packager builds from
      # it — so it needs the same proof the wheel gets. `--no-binary` forces a real build
      # from the source tree rather than resolving the wheel just installed.
      - name: Install the sdist and exercise the entry point
        run: |
          pip uninstall -y chemrefine
          pip install --no-binary chemrefine dist/*.tar.gz
          chemrefine --version
          chemrefine --help > /dev/null
          chemrefine validate examples/first_run/input.yaml
          chemrefine schema > /dev/null
          chemrefine engines --json > /dev/null

      - name: The package must advertise its types
        run: |
          python - <<'PY'
          import importlib.util, pathlib, sys
          spec = importlib.util.find_spec("chemrefine")
          marker = pathlib.Path(spec.submodule_search_locations[0]) / "py.typed"
          if not marker.is_file():
              sys.exit(f"py.typed missing from the installed wheel ({marker})")
          print(f"py.typed present at {marker}")
          PY

      # The sdist ships tests and examples precisely so the suite can be run from it —
      # and nothing else executes that suite: a file the suite reads that falls out of
      # the tarball fails here while every job that runs from the checkout stays green.
      # Unpack the artifact, install it with the same extras the test job uses, and run
      # the suite inside the unpacked tree; the repo-only guards skip themselves there
      # with named reasons.
      - name: The suite must pass from the unpacked sdist
        run: |
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"/chemrefine-*/
          pip install ".[test]"
          python -m pytest -q -p no:cacheprovider

  required-checks-pass:
    if: always()
    needs:
      - pre-commit
      - test
      - extras-resolve
      - floors
      - type-check
      - mutation-gate
      - docs-check
      - build-package
      - install-smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
