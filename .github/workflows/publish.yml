name: Build & maybe publish to PyPI

on:
  push:
    tags: ["*"]
  release:
    types: [published]
  workflow_dispatch:

# Least privilege at the workflow level; the release/publish jobs declare the
# write permissions they actually need themselves.
permissions:
  contents: read

jobs:
  build-package:
    name: Build & verify package
    runs-on: ubuntu-latest

    # Signed build provenance for the artifacts we publish: `attestations: write`
    # + `id-token: write` let build-and-inspect run actions/attest-build-provenance,
    # so a consumer can verify with `gh attestation verify` that these files were
    # built by this workflow from this commit. (PyPI's own PEP 740 attestations are
    # separate and already automatic — gh-action-pypi-publish defaults them on.)
    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: hynek/build-and-inspect-python-package@d44ca7d91762de7a7d5436ddae667c6da6d1c3df # v2.18.0
        with:
          attest-build-provenance-github: true

  # Create a GitHub Release automatically when a non-dev tag is pushed
  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'dev')
    runs-on: ubuntu-latest
    needs: build-package
    permissions:
      contents: write
    steps:
      # persist-credentials: false is safe here — action-gh-release authenticates
      # to the API with GITHUB_TOKEN, it does not push over the git remote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true

  # Publish dev tags (e.g. v4.0.0.dev1) to TestPyPI
  release-test-pypi:
    name: Publish to test.pypi.org
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && contains(github.ref, 'dev')
    runs-on: ubuntu-latest
    needs: build-package
    permissions:
      id-token: write

    steps:
      - name: Download packages built by build-and-inspect-python-package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(basename dist/*.tar.gz .tar.gz)"
          version="${version#*-}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the built version ${version}; bump pyproject.toml first"
            exit 1
          fi

      - name: Upload package to Test PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          repository-url: https://test.pypi.org/legacy/

  # Publish to real PyPI on a non-dev tag push, or on a manually published
  # Release. The tag-push condition is load-bearing: the Release that
  # `create-release` makes is authored by GITHUB_TOKEN, and events created by
  # GITHUB_TOKEN never trigger workflows — so `release: published` alone would
  # mean automated releases silently never reach PyPI.
  release-pypi:
    name: Publish to pypi.org
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'dev'))
      || github.event.action == 'published'
    runs-on: ubuntu-latest
    needs: build-package
    permissions:
      id-token: write

    steps:
      - name: Download packages built by build-and-inspect-python-package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist

      # GITHUB_REF_NAME is the tag on both trigger paths (tag push and
      # release-published both run at the tag ref), so a v2.1.0 tag can never
      # publish a wheel whose pyproject.toml still says 2.0.0.
      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(basename dist/*.tar.gz .tar.gz)"
          version="${version#*-}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the built version ${version}; bump pyproject.toml first"
            exit 1
          fi

      - name: Upload package to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
