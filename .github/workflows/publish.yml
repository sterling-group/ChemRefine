name: Build & maybe publish to PyPI

on:
  push:
    tags: ["*"]
  release:
    types: [published]
  workflow_dispatch:

# Least privilege at the workflow level; the release/publish jobs declare the
# write permissions they actually need themselves.
permissions:
  contents: read

jobs:
  # The full CI matrix, as one call rather than a reduced copy. `ci.yml` triggers on
  # pushes to main and on pull requests, neither of which a tag is — so without this the
  # release path would skip pytest, mypy, ruff, the extras resolution and the wheel
  # smoke test, and `build-and-inspect` (metadata only) would be everything standing
  # between a tag and PyPI. Every publish job below waits on it.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-package:
    name: Build & verify package
    runs-on: ubuntu-latest

    # Signed build provenance for the artifacts we publish: `attestations: write`
    # + `id-token: write` let build-and-inspect run actions/attest-build-provenance,
    # so a consumer can verify with `gh attestation verify` that these files were
    # built by this workflow from this commit. (PyPI's own PEP 740 attestations are
    # separate and already automatic — gh-action-pypi-publish defaults them on.)
    permissions:
      contents: read
      attestations: write
      id-token: write

    # Where this run's artifact goes, decided once, below, and read by every job that
    # releases anything: `pypi`, `testpypi`, or `none`. And what was built, for the jobs
    # that upload to an index to compare with: `sha256sum`'s lines for the sdist and the
    # wheel, base64-encoded onto one.
    outputs:
      channel: ${{ steps.route.outputs.channel }}
      built: ${{ steps.built.outputs.sums }}

    # No step of this job's own fetches a package: whatever runs here can sign in this
    # repository's name, so beyond the checkout and the pinned build action there is only
    # shell. The SBOM a release attaches is made in ci.yml's install job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # `upload-name-suffix` is load-bearing, not cosmetic. The `ci` job above calls
      # ci.yml, whose own `build-package` runs this same action, and a reusable workflow
      # shares the caller's run — so both uploads land in one run and the default names
      # (`Packages`, `Package Metadata`, `PyPI README`) collide. upload-artifact refuses a
      # duplicate name, so one of the two jobs fails and every publish job below, which
      # needs them both, is skipped.
      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2
        id: baipp
        with:
          attest-build-provenance-github: true
          upload-name-suffix: "-release"

      # An artifact belongs to the run, and any job of the run can replace one: the jobs of
      # the `ci` call install what an index serves that day, in the same run. A job's
      # outputs are its own. So this job states what it built where no other job can
      # write, and the jobs that upload to an index send nothing else.
      - name: Record what was built
        id: built
        env:
          DIST: ${{ steps.baipp.outputs.dist }}
        run: |
          set -o pipefail
          cd "$DIST"
          sums="$(sha256sum -- *.tar.gz *.whl | base64 --wrap=0)"
          echo "sums=$sums" >> "$GITHUB_OUTPUT"

      # Where this run's artifact goes, decided once and read off the artifact. On a v* tag
      # push or a published release — both run at the tag, so GITHUB_REF_NAME is the tag —
      # the tag must name the version that was built, and then a dev version goes to
      # TestPyPI and anything else to PyPI; any other event (a manual dispatch, a tag
      # without the `v`) releases nothing.
      #
      # The version is read with PEP 440's own pattern for a canonical public version,
      # which is the form the build backend writes, and in the shell, which needs nothing
      # installed. In that form a dev release is the one whose last segment is `.devN`. A
      # version the pattern does not take fails the step instead of reading as "not a dev
      # release" and routing to PyPI.
      - name: Route the release by the version that was built
        id: route
        env:
          VERSION: ${{ steps.baipp.outputs.package_version }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          canonical='^([1-9][0-9]*!)?(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))*((a|b|rc)(0|[1-9][0-9]*))?(\.post(0|[1-9][0-9]*))?(\.dev(0|[1-9][0-9]*))?$'
          channel=none
          if { [ "$EVENT_NAME" = push ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; } \
             || { [ "$EVENT_NAME" = release ] && [ "$EVENT_ACTION" = published ]; }; then
            if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the built version $VERSION; bump pyproject.toml first"
              exit 1
            fi
            if ! [[ "$VERSION" =~ $canonical ]]; then
              echo "::error::the built version $VERSION is not a canonical PEP 440 version; nothing is released"
              exit 1
            fi
            channel=pypi
            if [[ "$VERSION" == *.dev* ]]; then channel=testpypi; fi
          fi
          echo "version $VERSION, $EVENT_NAME at $GITHUB_REF: channel $channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  # Create a GitHub Release automatically when a tag bound for PyPI is pushed
  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && needs.build-package.outputs.channel == 'pypi'
    runs-on: ubuntu-latest
    needs: [ci, build-package]
    permissions:
      contents: write
    steps:
      # persist-credentials: false is safe here — action-gh-release authenticates
      # to the API with GITHUB_TOKEN, it does not push over the git remote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Made by the `ci` job above, where ci.yml installs the wheel it built from this
      # commit: what that install resolved to is what the SBOM lists.
      - name: Download the SBOM of this commit's install
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SBOM
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: chemrefine-sbom.cdx.json

  # Publish dev versions (e.g. v4.0.0.dev1) to TestPyPI, by tag push or published release
  release-test-pypi:
    name: Publish to test.pypi.org
    if: needs.build-package.outputs.channel == 'testpypi'
    runs-on: ubuntu-latest
    needs: [ci, build-package]
    permissions:
      id-token: write

    steps:
      - name: Download packages built by build-and-inspect-python-package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages-release
          path: dist

      # The build job's own account of its sdist and wheel, against everything the
      # artifact holds now, dot-named files included: a file changed, missing or added
      # since fails here, before anything is signed or sent.
      - name: The files to upload are the files that were built
        env:
          BUILT: ${{ needs.build-package.outputs.built }}
        run: |
          set -o pipefail
          shopt -s dotglob
          cd dist
          echo "$BUILT" | base64 --decode | LC_ALL=C sort > "$RUNNER_TEMP/built"
          sha256sum -- * | LC_ALL=C sort > "$RUNNER_TEMP/found"
          diff "$RUNNER_TEMP/built" "$RUNNER_TEMP/found"

      - name: Upload package to Test PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  # Publish to real PyPI on a non-dev tag push, or on a manually published
  # Release of a non-dev version. The tag-push trigger is load-bearing: the
  # Release that `create-release` makes is authored by GITHUB_TOKEN, and events
  # created by GITHUB_TOKEN never trigger workflows — so `release: published`
  # alone would mean automated releases silently never reach PyPI.
  release-pypi:
    name: Publish to pypi.org
    if: needs.build-package.outputs.channel == 'pypi'
    runs-on: ubuntu-latest
    needs: [ci, build-package]
    # An upload to PyPI is permanent: a version can be yanked, but the filename can
    # never be reused, so a mistaken `git push --tags` is not something a follow-up
    # commit can undo. This environment carries a required reviewer, which turns the
    # last step into an explicit human approval rather than a consequence of a tag
    # reaching the remote. TestPyPI above is deliberately left ungated — it is
    # disposable, and gating it would only teach people to click through.
    #
    # The name is load-bearing beyond the gate: `pypi` is part of the OIDC claim
    # PyPI verifies, so it has to match the Environment field on the trusted
    # publisher exactly, or the upload is rejected as an unknown publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/chemrefine
    permissions:
      id-token: write

    steps:
      - name: Download packages built by build-and-inspect-python-package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages-release
          path: dist

      # As in the TestPyPI job: only what the build job says it built is uploaded.
      - name: The files to upload are the files that were built
        env:
          BUILT: ${{ needs.build-package.outputs.built }}
        run: |
          set -o pipefail
          shopt -s dotglob
          cd dist
          echo "$BUILT" | base64 --decode | LC_ALL=C sort > "$RUNNER_TEMP/built"
          sha256sum -- * | LC_ALL=C sort > "$RUNNER_TEMP/found"
          diff "$RUNNER_TEMP/built" "$RUNNER_TEMP/found"

      - name: Upload package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
