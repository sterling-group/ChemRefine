name: Build & maybe publish to PyPI

on:
  push:
    tags: ["*"]
  release:
    types: [published]
  workflow_dispatch:

# Least privilege at the workflow level; the release/publish jobs declare the
# write permissions they actually need themselves.
permissions:
  contents: read

jobs:
  # The full CI matrix, as one call rather than a reduced copy. `ci.yml` triggers on
  # pushes to main and on pull requests, neither of which a tag is — so without this the
  # release path skipped pytest, mypy, ruff, the extras resolution and the wheel smoke
  # test, and `build-and-inspect` (metadata only) was everything standing between a tag
  # and PyPI. Every publish job below waits on it.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-package:
    name: Build & verify package
    runs-on: ubuntu-latest

    # Signed build provenance for the artifacts we publish: `attestations: write`
    # + `id-token: write` let build-and-inspect run actions/attest-build-provenance,
    # so a consumer can verify with `gh attestation verify` that these files were
    # built by this workflow from this commit. (PyPI's own PEP 740 attestations are
    # separate and already automatic — gh-action-pypi-publish defaults them on.)
    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # `upload-name-suffix` is load-bearing, not cosmetic. The `ci` job above calls
      # ci.yml, whose own `build-package` runs this same action, and a reusable workflow
      # shares the caller's run — so both uploads land in one run and the default names
      # (`Packages`, `Package Metadata`, `PyPI README`) collide. upload-artifact refuses a
      # duplicate name, so one of the two jobs fails and every publish job below, which
      # needs them both, is skipped.
      - uses: hynek/build-and-inspect-python-package@d44ca7d91762de7a7d5436ddae667c6da6d1c3df # v2.18.0
        with:
          attest-build-provenance-github: true
          upload-name-suffix: "-release"

      # Provenance says who built the artifact; the SBOM says what is inside it. A user
      # auditing a CVE against their install needs the second, and reconstructing it from
      # pyproject floors after the fact gives the wrong answer — the floors are not what
      # the resolver actually picked.
      - name: Generate a CycloneDX SBOM
        run: |
          python -m pip install --quiet cyclonedx-bom
          python -m cyclonedx_py environment \
            --output-format JSON \
            --outfile chemrefine-sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SBOM
          path: chemrefine-sbom.cdx.json
          if-no-files-found: error

  # Create a GitHub Release automatically when a non-dev tag is pushed
  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'dev')
    runs-on: ubuntu-latest
    needs: [ci, build-package]
    permissions:
      contents: write
    steps:
      # persist-credentials: false is safe here — action-gh-release authenticates
      # to the API with GITHUB_TOKEN, it does not push over the git remote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the SBOM built alongside the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SBOM
      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: chemrefine-sbom.cdx.json

  # Publish dev tags (e.g. v4.0.0.dev1) to TestPyPI
  release-test-pypi:
    name: Publish to test.pypi.org
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && contains(github.ref, 'dev')
    runs-on: ubuntu-latest
    needs: [ci, build-package]
    permissions:
      id-token: write

    steps:
      - name: Download packages built by build-and-inspect-python-package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages-release
          path: dist

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(basename dist/*.tar.gz .tar.gz)"
          version="${version#*-}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the built version ${version}; bump pyproject.toml first"
            exit 1
          fi

      - name: Upload package to Test PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          repository-url: https://test.pypi.org/legacy/

  # Publish to real PyPI on a non-dev tag push, or on a manually published
  # Release. The tag-push condition is load-bearing: the Release that
  # `create-release` makes is authored by GITHUB_TOKEN, and events created by
  # GITHUB_TOKEN never trigger workflows — so `release: published` alone would
  # mean automated releases silently never reach PyPI.
  release-pypi:
    name: Publish to pypi.org
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'dev'))
      || github.event.action == 'published'
    runs-on: ubuntu-latest
    needs: [ci, build-package]
    # An upload to PyPI is permanent: a version can be yanked, but the filename can
    # never be reused, so a mistaken `git push --tags` is not something a follow-up
    # commit can undo. This environment carries a required reviewer, which turns the
    # last step into an explicit human approval rather than a consequence of a tag
    # reaching the remote. TestPyPI above is deliberately left ungated — it is
    # disposable, and gating it would only teach people to click through.
    #
    # The name is load-bearing beyond the gate: `pypi` is part of the OIDC claim
    # PyPI verifies, so it has to match the Environment field on the trusted
    # publisher exactly, or the upload is rejected as an unknown publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/chemrefine
    permissions:
      id-token: write

    steps:
      - name: Download packages built by build-and-inspect-python-package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages-release
          path: dist

      # GITHUB_REF_NAME is the tag on both trigger paths (tag push and
      # release-published both run at the tag ref), so a v2.1.0 tag can never
      # publish a wheel whose pyproject.toml still says 2.0.0.
      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(basename dist/*.tar.gz .tar.gz)"
          version="${version#*-}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the built version ${version}; bump pyproject.toml first"
            exit 1
          fi

      - name: Upload package to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
