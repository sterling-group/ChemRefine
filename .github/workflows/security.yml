name: Security audit

# Dependabot keeps the floors fresh; this catches known CVEs in what the
# floors actually resolve to today, independent of any code change landing.
on:
  schedule:
    - cron: "23 5 * * 1" # weekly, Monday morning UTC
  workflow_dispatch:
  # pip-audit runs weekly, which means a PR that pulls in a vulnerable dependency
  # can sit on main for up to six days before anything says so. dependency-review
  # catches it in the PR that introduces it.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bc41886e18ea39df68b1b1245f4184881938e050 # v4.6.0
        with:
          fail-on-severity: high

  pip-audit:
    # Scheduled sweep only. Auditing the fully-resolved environment costs a real
    # install; on a PR, dependency-review above already covers what that PR changes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 3.12, because an extra is audited by resolving it, and a capped extra resolves to
      # nothing on a Python it excludes: on 3.13 `mlip-orb` and `mlip-chgnet` are empty lists,
      # audited clean. 3.12 is the one Python every extra installs on, and the last step
      # fails when that stops being true.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the resolved environment
        # pip upgrades itself first — the audit covers the whole environment,
        # and a stale runner pip would otherwise fail the job on its own CVE.
        run: |
          pip install --upgrade pip
          pip install -e ".[server]" pip-audit

      - name: Audit for known vulnerabilities
        # --skip-editable: the local chemrefine checkout isn't on PyPI.
        run: pip-audit --skip-editable

      # The environment audit above covers what the base install resolves to — which
      # excludes every heavy extra, so without this step the MLIP/PySCF stacks' pins
      # (torch, e3nn, gpu4pyscf, …) go unaudited. Installing them is out of the
      # question here, but auditing needs only names and versions: resolve each extra
      # with `--dry-run --report` (metadata only, the same trick ci.yml's
      # extras-resolve uses — no torch wheel is downloaded) and audit its pins with
      # `--no-deps`, which is sound because the report already *is* the fully-resolved
      # set for this platform.
      #
      # Each extra on its own, never one merged list. The backends are separate
      # environments because their stacks disagree — MACE's e3nn 0.4.4 beside FAIRChem's
      # 0.6, a torch each — and pip-audit hands a requirements file to pip, which refuses
      # two versions of one package before anything is audited.
      #
      # An advisory in a stack somebody else pins cannot be fixed from here, and a job that
      # is red every week for it stops being read. So one may be accepted below: by id, for
      # the one package it is in, with the reason and what lifts it beside it. An entry no
      # closure holds any more fails the job, the way a cap that has outlived its reason
      # fails ci.yml.
      - name: Audit every extra's resolved closure
        run: |
          python - <<'PY'
          import json, subprocess, sys, tempfile, tomllib
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name

          ACCEPTED = {
              # fairchem-core pins `setuptools<81`, so 80.10.2 is the newest its env can
              # hold. The advisory, fixed in 83.0.0, is about what `sdist` packs on a
              # filesystem that keeps Unicode forms apart, and a backend env builds no
              # source archive. It goes when fairchem-core lifts the pin.
              "CVE-2026-59890": "setuptools",
          }

          here = f"{sys.version_info.major}.{sys.version_info.minor}"
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          extras = project["optional-dependencies"]
          pythons = [c.rsplit(" ", 1)[1] for c in project["classifiers"]
                     if c.startswith("Programming Language :: Python :: 3.")]

          def own(extra, version):
              """The names this extra itself requires on that Python, self-references dropped."""
              env = {"extra": extra, "python_version": version,
                     "python_full_version": f"{version}.0"}
              return {
                  r.name for raw in extras[extra]
                  if (r := Requirement(raw)).name != "chemrefine"
                  and (r.marker is None or r.marker.evaluate(env))
              }

          def closure(extra, tmp):
              """This extra's resolved pins beyond the environment, or why there are none."""
              report = f"{tmp}/report.json"
              done = subprocess.run(
                  [sys.executable, "-m", "pip", "install", "--dry-run", "--quiet",
                   "--report", report, f".[{extra}]"],
                  capture_output=True, text=True,
              )
              if done.returncode != 0:
                  return None, done.stderr.strip().splitlines()[-1:]
              return sorted(
                  f"{item['metadata']['name']}=={item['metadata']['version']}"
                  for item in json.load(open(report))["install"]
                  if item["metadata"]["name"].lower() != "chemrefine"  # not on PyPI
              ), None

          def audited(pins, tmp):
              """pip-audit's findings for those pins, or the reason it has none to give."""
              listed, found = f"{tmp}/pins.txt", f"{tmp}/found.json"
              open(listed, "w").write("\n".join(pins) + "\n")
              done = subprocess.run(
                  ["pip-audit", "--no-deps", "-r", listed, "-f", "json", "-o", found],
                  capture_output=True, text=True,
              )
              try:
                  return json.load(open(found))["dependencies"], None
              except (OSError, ValueError):
                  return None, done.stderr.strip().splitlines()[-1:]

          problems, used = [], set()
          for extra in sorted(extras):
              print(f"::group::[{extra}]")
              excluded = set().union(*(own(extra, v) for v in pythons)) - own(extra, here)
              if excluded:
                  problems.append(
                      f"[{extra}] leaves out {sorted(excluded)} on Python {here}, so its stack "
                      f"would go unaudited. Run this job on a Python every extra installs on."
                  )
              with tempfile.TemporaryDirectory() as tmp:
                  pins, why = closure(extra, tmp)
                  dependencies = []
                  if pins is None:
                      problems.append(f"[{extra}] does not resolve: {why}")
                  elif pins:
                      dependencies, why = audited(pins, tmp)
                      if dependencies is None:
                          problems.append(f"[{extra}] could not be audited: {why}")
              print(f"{len(pins or [])} pinned requirement(s) beyond the environment")
              seen = set()
              for dependency in dependencies or []:
                  name = dependency["name"]
                  if "skip_reason" in dependency:
                      skipped = dependency["skip_reason"]
                      problems.append(f"[{extra}] {name} was not audited: {skipped}")
                  for vuln in dependency.get("vulns", []):
                      if (name, vuln["id"]) in seen:
                          continue
                      seen.add((name, vuln["id"]))
                      ids = {vuln["id"], *vuln.get("aliases", [])}
                      accepted = [k for k, package in ACCEPTED.items()
                                  if k in ids and package == canonicalize_name(name)]
                      used.update(accepted)
                      fixed = ", ".join(vuln.get("fix_versions") or []) or "no release"
                      line = f"{name} {dependency['version']}: {vuln['id']} (fixed in {fixed})"
                      print(line + (f" — accepted as {accepted[0]}" if accepted else ""))
                      if not accepted:
                          problems.append(f"[{extra}] {line}")
              print("::endgroup::")

          for unused in sorted(set(ACCEPTED) - used):
              problems.append(
                  f"{unused} ({ACCEPTED[unused]}) is accepted in this file, and no extra's "
                  f"closure holds it any more — the exception has outlived its advisory. "
                  f"Delete it."
              )
          if problems:
              sys.exit("\n".join(problems))
          print(f"every extra's closure is clean on Python {here}")
          PY
