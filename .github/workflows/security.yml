name: Security audit

# Dependabot keeps the floors fresh; this catches known CVEs in what the
# floors actually resolve to today, independent of any code change landing.
on:
  schedule:
    - cron: "23 5 * * 1" # weekly, Monday morning UTC
  workflow_dispatch:
  # pip-audit runs weekly, which means a PR that pulls in a vulnerable dependency
  # can sit on main for up to six days before anything says so. dependency-review
  # catches it in the PR that introduces it.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bc41886e18ea39df68b1b1245f4184881938e050 # v4.6.0
        with:
          fail-on-severity: high

  pip-audit:
    # Scheduled sweep only. Auditing the fully-resolved environment costs a real
    # install; on a PR, dependency-review above already covers what that PR changes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the resolved environment
        # pip upgrades itself first — the audit covers the whole environment,
        # and a stale runner pip would otherwise fail the job on its own CVE.
        run: |
          pip install --upgrade pip
          pip install -e ".[server]" pip-audit

      - name: Audit for known vulnerabilities
        # --skip-editable: the local chemrefine checkout isn't on PyPI.
        run: pip-audit --skip-editable

      # The environment audit above covers what the base install resolves to — which
      # excludes every heavy extra, so the MLIP/PySCF stacks' pins (torch, e3nn,
      # gpu4pyscf, …) were never audited by anything. Installing them is out of the
      # question here, but auditing needs only names and versions: resolve each extra
      # with `--dry-run --report` (metadata only, the same trick ci.yml's
      # extras-resolve uses — no torch wheel is downloaded), merge the pinned
      # closures, and audit the list with `--no-deps`, which is sound because the
      # report already *is* the fully-resolved set for this platform.
      - name: Audit every extra's resolved closure
        run: |
          extras=$(python -c "import tomllib;print(' '.join(sorted(tomllib.load(open('pyproject.toml','rb'))['project']['optional-dependencies'])))")
          for extra in $extras; do
            echo "::group::resolve [$extra]"
            pip install --dry-run --quiet --report "resolve-$extra.json" ".[$extra]"
            echo "::endgroup::"
          done
          python - <<'PY'
          import glob, json

          pins: set[str] = set()
          for path in glob.glob("resolve-*.json"):
              for item in json.load(open(path))["install"]:
                  meta = item["metadata"]
                  if meta["name"].lower() == "chemrefine":  # local checkout, not on PyPI
                      continue
                  pins.add(f"{meta['name']}=={meta['version']}")
          with open("resolved-extras.txt", "w") as fh:
              fh.write("\n".join(sorted(pins)) + "\n")
          print(f"{len(pins)} pinned requirement(s) to audit")
          PY
          pip-audit --no-deps -r resolved-extras.txt
