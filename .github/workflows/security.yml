name: Security audit

# Dependabot keeps the floors fresh; this catches known CVEs in what the
# floors actually resolve to today, independent of any code change landing.
on:
  schedule:
    - cron: "23 5 * * 1" # weekly, Monday morning UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the resolved environment
        # pip upgrades itself first — the audit covers the whole environment,
        # and a stale runner pip would otherwise fail the job on its own CVE.
        run: |
          pip install --upgrade pip
          pip install -e ".[server]" pip-audit

      - name: Audit for known vulnerabilities
        # --skip-editable: the local chemrefine checkout isn't on PyPI.
        run: pip-audit --skip-editable
