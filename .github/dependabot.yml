# Weekly dependency-freshness PRs. The pip ecosystem watches pyproject.toml
# floors; github-actions watches the SHA-pinned actions in .github/workflows/.
#
# Every `uses:` is pinned to a full commit SHA with the release tag in a trailing
# comment (`@<sha> # v1.2.3`). Dependabot reads that comment to know the current
# version and rewrites both the SHA and the comment on an update, so pinning
# costs nothing in freshness. That holds for pypa/gh-action-pypi-publish and
# re-actors/alls-green too, which are pinned to a release tag like the rest and
# not to the moving `release/v1` branch both also publish: a branch has no
# version for Dependabot to compare against.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
