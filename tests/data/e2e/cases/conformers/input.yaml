# Conformers on ORCA/xTB at one core: a conformer search, a cut, a kick and an ionisation,
# on one formic acid molecule throughout. The seed (formic_acid.xyz) is Z-formic acid,
# O=C-O-H dihedral 0 deg; E (180 deg) lies 7.09 kcal/mol above it at GFN2-xTB. The one
# frame is real chemistry: nothing here is code-only.
#   1 goat    GOAT finds both planar conformers on lean settings, and the 99% Boltzmann cut
#             drops E (weight 6e-6 at 298.15 K): the filter really removes a structure
#   2 kick    `random` NMS on Z, a minimum: seed 7 draws one vibration, and the pair of
#             children displaced +/-0.3 along it both relax back to Z
#   3 ionise  HF/STO-3G single point on both children as the cation doublet (UHF): a
#             vertical ionisation of 0.268 Eh (7.3 eV) at this level. The children end 7e-5
#             Eh apart, a near-tie, so `min 1` keeps the lower, whichever it is
#
# The GOAT template asks for `nprocs 8`; max_cores clamps what ORCA is given to 1.
template_dir: ./templates
output_dir: ./outputs
executables: { orca: orca }  # the live harness injects the resolved absolute path
dispatch: auto
max_cores: 1

input: ./formic_acid.xyz
charge: 0
multiplicity: 1

steps:
  # `! GOAT XTB` (the template): one worker at one temperature (NWORKERS 1, TEMPLIST) for one
  # global iteration (MAXGLOBALITER 1), 15 optimisations in 5 to 6 s. Without NWORKERS and
  # TEMPLIST, ORCA splits the search over 8 workers: 120 optimisations and 40 s.
  # `RANDOMSEED FALSE` gives every run the same random numbers, and so the same search and
  # the same ensemble. On ORCA's own seed, one run in twelve of a search this lean found Z
  # alone.
  - step: 1
    name: goat
    engine: orca
    sample: { method: boltzmann, percent_cumulative: 99 }

  # `! Opt Freq XTB2`: the operation is inferred, the NMS target is `random` on purpose. Z
  # has no imaginary mode, so there is nothing to repair: seed 7 draws among the nine
  # vibrations ORCA names (for id 0-0, mode 9 at 1123 cm-1). No sample: both children go on.
  - step: 2
    name: kick
    engine: orca
    nms: true
    options: { target: random, num_random_displacements: 1, displacement_value: 0.3, seed: 7 }

  # `! HF STO-3G`: the step's charge and multiplicity override the workflow's neutral
  # singlet, and ORCA picks UHF for the doublet.
  - step: 3
    name: ionise
    engine: orca
    charge: 1
    multiplicity: 2
    sample: { method: min, count: 1 }
