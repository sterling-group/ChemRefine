# MACE fine-tune for the live tier: one epoch, and no multihead replay (the tutorial ships
# that), so the fit takes seconds and proves the plumbing, not a model.
name: $RUN_NAME
work_dir: $RUN_DIR
train_file: $TRAIN_SET
valid_file: $VALID_SET
device: $DEVICE
seed: $SEED

foundation_model: $FOUNDATION_MODEL
multiheads_finetuning: False
E0s: average

max_num_epochs: 1
batch_size: 1  # one training frame, and MACE drops a last partial batch
default_dtype: float64
