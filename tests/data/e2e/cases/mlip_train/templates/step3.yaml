# SevenNet fine-tune (from `sevenn preset fine_tune`), cut to one epoch on a molecular set.
model:
    chemical_species: 'Auto'
    cutoff: 5.0
    channel: 128
    is_parity: False
    lmax: 2
    num_convolution_layer: 5
    irreps_manual:
        - "128x0e"
        - "128x0e+64x1e+32x2e"
        - "128x0e+64x1e+32x2e"
        - "128x0e+64x1e+32x2e"
        - "128x0e+64x1e+32x2e"
        - "128x0e"
    weight_nn_hidden_neurons: [64, 64]
    radial_basis:
        radial_basis_name: 'bessel'
        bessel_basis_num: 8
    cutoff_function:
        cutoff_function_name: 'XPLOR'
        cutoff_on: 4.5
    self_connection_type: 'linear'
    train_shift_scale: False
    train_denominator: False

train:
    device: $DEVICE
    random_seed: 1
    is_train_stress: False
    epoch: 1
    loss: 'Huber'
    loss_param:
        delta: 0.01
    optimizer: 'adam'
    optim_param:
        lr: 0.004
    scheduler: 'exponentiallr'
    scheduler_param:
        gamma: 0.99
    force_loss_weight: 1.0
    per_epoch: 1
    error_record:
        - ['Energy', 'RMSE']
        - ['Force', 'RMSE']
        - ['TotalLoss', 'None']
    continue:
        reset_optimizer: True
        reset_scheduler: True
        reset_epoch: True
        checkpoint: '$FOUNDATION_MODEL'

data:
    batch_size: 2
    data_format_args:
        index: ':'
    load_trainset_path: ['$TRAIN_SET']
    load_validset_path: ['$VALID_SET']
