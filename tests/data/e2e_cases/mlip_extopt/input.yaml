# Capture case: ORCA ExtOpt optimisation of ethanol over a CPU MACE server.
template_dir: ./templates
output_dir: ./outputs
executables: { orca: orca }  # the live harness injects the resolved absolute path
dispatch: auto
max_cores: 8

input: ./ethanol.xyz
charge: 0
multiplicity: 1

steps:
  - step: 1
    engine: mlip-extopt
    operation: opt_sp
    options: { task_name: mace_off, model_name: small, device: cpu }
    sample: { method: min, count: 1 }
